<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#04101A">
<meta property="og:type" content="website">
<meta property="og:title" content="蓝仓智脑 · 莱州湾智慧海洋牧场知识智能体">
<meta property="og:description" content="把论文写在海面上，把代码种进滩涂里。零网络依赖的渔业专家智能体，断网也能跑。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304101A'/%3E%3Cpath d='M12 42c6-9 12-9 20 0s14 9 20 0' stroke='%232FD6D0' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='4.5' fill='%232FD6D0'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#e8f7fb;
  --ink2:#a7c8d4;
  --ink3:#6d95a6;
  --sea900:#0a2231;
  --sea700:#12455a;
  --sea500:#2fd6d0;
  --sea300:#5ee7e0;
  --sea100:#0c2b3a;
  --bg:#04101a;
  --panel:rgba(9,26,38,.86);
  --line:rgba(70,190,215,.22);
  --line2:rgba(70,190,215,.13);
  --sand:#14313c;
  --ok:#3ddc97;
  --warn:#ffb545;
  --danger:#ff5f6d;
  --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  --r:10px;
  --glow:0 0 18px rgba(47,214,208,.16);
  --scale:1;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:calc(13px * var(--scale));
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(1000px 420px at 6% -8%, rgba(47,214,208,.13) 0%, rgba(47,214,208,0) 60%),
    radial-gradient(900px 420px at 98% 4%, rgba(38,120,190,.16) 0%, rgba(38,120,190,0) 58%),
    radial-gradient(800px 500px at 50% 110%, rgba(20,90,110,.20) 0%, rgba(20,90,110,0) 62%),
    linear-gradient(rgba(47,214,208,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,214,208,.045) 1px, transparent 1px);
  background-size:auto,auto,auto,34px 34px,34px 34px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.app::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  opacity:.5;
}

/* ---------- 顶栏 ---------- */
.topbar{
  height:54px;flex:0 0 54px;
  display:flex;align-items:center;gap:14px;
  padding:0 14px;
  background:linear-gradient(180deg, rgba(8,26,38,.96), rgba(6,20,30,.88));
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(47,214,208,.10), 0 10px 26px rgba(0,0,0,.35);
  position:relative;z-index:5;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(47,214,208,.65), rgba(47,214,208,.05) 55%, transparent);
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.logo{
  font-size:calc(17px * var(--scale));
  font-weight:800;letter-spacing:2px;color:#eafcff;
  position:relative;padding-left:15px;
  text-shadow:0 0 14px rgba(47,214,208,.45);
}
.logo::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) rotate(45deg);
  width:7px;height:7px;background:var(--sea500);border-radius:1px;
  box-shadow:0 0 10px rgba(47,214,208,.9);
}
.brand-sub{font-size:calc(11px * var(--scale));color:var(--ink3);letter-spacing:.6px}

.focusbar{
  flex:1 1 auto;min-width:0;
  font-size:calc(11.5px * var(--scale));
  color:#8fe9e2;
  background:linear-gradient(90deg, rgba(47,214,208,.10), rgba(47,214,208,.02));
  border:1px solid rgba(47,214,208,.22);
  border-radius:4px;
  padding:5px 12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);
  letter-spacing:.3px;
}
.tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tag-offline{
  flex:0 0 auto;
  font-family:var(--mono);font-size:calc(9.5px * var(--scale));
  letter-spacing:.6px;color:#5ff0b6;background:rgba(20,80,58,.45);
  border:1px solid rgba(61,220,151,.45);border-radius:4px;padding:3px 7px;white-space:nowrap;
  box-shadow:0 0 12px rgba(61,220,151,.15) inset;
}
.tbtn{
  font-family:var(--sans);font-size:calc(11.5px * var(--scale));
  color:var(--ink2);background:rgba(13,38,52,.85);border:1px solid var(--line);
  border-radius:4px;padding:5px 9px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.tbtn:hover{background:rgba(20,58,76,.95);border-color:rgba(47,214,208,.55);color:#d4fbf7;box-shadow:0 0 14px rgba(47,214,208,.18)}
.tbtn.on{background:linear-gradient(180deg,#1fb9b4,#0d7d84);border-color:#5ee7e0;color:#04141b;font-weight:700;box-shadow:0 0 16px rgba(47,214,208,.35)}

/* ---------- 主舞台 ---------- */
.stage{
  flex:1 1 auto;min-height:0;
  display:grid;
  grid-template-columns:minmax(290px,332px) minmax(400px,1fr) minmax(280px,340px);
  gap:9px;padding:9px;
}
.panel{
  background:linear-gradient(180deg, rgba(10,30,44,.92), rgba(7,22,33,.95));
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 0 30px rgba(47,214,208,.035);
  display:flex;flex-direction:column;
  min-height:0;min-width:0;overflow:hidden;
  position:relative;
}
.panel::before,.panel::after{
  content:"";position:absolute;width:14px;height:14px;pointer-events:none;
  border-color:rgba(47,214,208,.65);border-style:solid;z-index:2;
}
.panel::before{top:-1px;left:-1px;border-width:1.5px 0 0 1.5px;border-radius:var(--r) 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-width:0 1.5px 1.5px 0;border-radius:0 0 var(--r) 0}
.panel-head{
  flex:0 0 auto;
  display:flex;align-items:baseline;gap:8px;
  padding:9px 11px 8px;
  border-bottom:1px solid var(--line2);
  background:linear-gradient(90deg, rgba(47,214,208,.07), transparent 62%);
  position:relative;
}
.panel-head::after{
  content:"";position:absolute;left:0;bottom:-1px;width:64px;height:1px;background:var(--sea500);
  box-shadow:0 0 10px rgba(47,214,208,.8);
}
.panel-head span{font-size:calc(12.5px * var(--scale));font-weight:700;color:#dff7fb;letter-spacing:.8px}
.panel-head em{font-style:normal;font-size:calc(10px * var(--scale));color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 地图面板 ---------- */
.map-wrap{flex:0 0 auto;padding:6px 6px 0}
.map-wrap svg{display:block;width:100%;height:auto}
.disclaimer{
  flex:0 0 auto;
  font-size:calc(9.5px * var(--scale));line-height:1.5;color:var(--ink3);
  padding:4px 11px 8px;
}
.kpi{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:2px 10px 10px;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  grid-auto-rows:max-content;align-content:start;
}

/* ---------- 对话面板 ---------- */
.chat-log{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:10px 11px 4px;
  background-image:linear-gradient(rgba(47,214,208,.03) 1px, transparent 1px);
  background-size:100% 26px;
}
.chips{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;
  padding:7px 10px;border-top:1px solid var(--line2);
  background:rgba(8,24,35,.72);
}
.ask{
  flex:0 0 auto;display:flex;gap:6px;padding:8px 10px 10px;
  background:rgba(8,24,35,.72);
}
.ask input{
  flex:1 1 auto;min-width:0;
  font-family:var(--sans);font-size:calc(12px * var(--scale));color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;
  background:rgba(6,20,30,.9);
}
.ask input::placeholder{color:#4f7382}
.ask input:focus{border-color:rgba(47,214,208,.7);box-shadow:0 0 0 2px rgba(47,214,208,.14),0 0 16px rgba(47,214,208,.12)}
.ask button{
  flex:0 0 auto;font-family:var(--sans);font-size:calc(12px * var(--scale));font-weight:700;
  color:#04141b;background:linear-gradient(180deg,#5ee7e0,#1fb9b4);
  border:none;border-radius:6px;padding:0 16px;cursor:pointer;
  box-shadow:0 0 16px rgba(47,214,208,.3);
}
.ask button:hover{filter:brightness(1.1)}

/* ---------- 实验室 ---------- */
.lab{flex:1 1 auto;min-height:0;overflow-y:auto;padding:9px 10px 12px}

/* ---------- 页脚 ---------- */
.foot{
  flex:0 0 26px;height:26px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  font-size:calc(10px * var(--scale));color:#4f7382;
  border-top:1px solid var(--line);
  background:linear-gradient(180deg, rgba(6,20,30,.6), rgba(4,14,22,.9));
  letter-spacing:.4px;
}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(47,214,208,.28);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(47,214,208,.45)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 投影模式：字号放大 + 对比度提升 ---------- */
body.proj{--scale:1.12}
body.proj .panel{background:linear-gradient(180deg,#0a1f2d,#071722)}
body.proj .summary,body.proj .acts li,body.proj details.reason li{color:#cfe8ef}
body.proj .focusbar{color:#a6f4ee}

/* ---------- 性能模式 ---------- */
body.perf *{animation:none !important;transition:none !important;backdrop-filter:none !important}
body.perf .app::before{display:none}

/* ---------- 窄屏 ---------- */
.mobile-only{display:none}
@media (max-width:1240px){
  .stage{grid-template-columns:minmax(260px,300px) minmax(380px,1fr) minmax(250px,296px)}
  .brand-sub{display:none}
}
@media (max-width:1040px){
  .stage{grid-template-columns:minmax(210px,240px) 1fr}
  .panel-lab{display:none}
  .focusbar{display:none}
}

/* ---------- 手机（扫码打开） ---------- */
@media (max-width:760px){
  .topbar{height:48px;flex:0 0 48px;padding:0 8px;gap:6px}
  .logo{font-size:15px;letter-spacing:1px;padding-left:12px}
  .brand-sub{display:none}
  .focusbar{display:none}
  .tag-offline{display:none}
  .tools{gap:4px;margin-left:auto}
  .tbtn{padding:7px 11px;font-size:calc(11px * var(--scale));touch-action:manipulation}
  #btnPerf,#btnProj{display:none}
  .mobile-only{display:inline-block}
  .chip{padding:7px 11px;touch-action:manipulation}
  .ask button{padding:0 14px}
  .stage{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr);
    padding:6px;gap:6px;
    position:relative;
  }
  .panel-lab{display:none}
  .panel-chat{min-height:0}
  .panel-map{
    display:none;
    position:absolute;inset:6px;z-index:30;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  body.map-open .panel-map{display:flex}
  body.map-open .panel-chat{visibility:hidden}
  body.map-open .kpi-card .v{font-size:calc(15px * var(--scale))}
  .kpi{grid-template-columns:1fr 1fr}
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
  .chip{flex:0 0 auto;white-space:nowrap}
  .chips::-webkit-scrollbar{height:0}
  .foot{font-size:9px;padding:0 8px}
  .foot span:last-child{display:none}
  .msg-head .focus-pill{max-width:150px}
  .bubble{max-width:92%}
  .card{padding:8px 9px 9px}
  .answer-chart svg{max-width:100%}
  .map-wrap{padding:4px 4px 0;display:flex;justify-content:center}
  .map-wrap svg{max-width:76vw;margin:0 auto}
}

</style>
<style>
/* ========== 消息 ========== */
.msg{margin-bottom:10px}
.msg-user{display:flex;justify-content:flex-end}
.bubble{
  max-width:88%;
  background:linear-gradient(180deg, rgba(47,214,208,.22), rgba(20,140,150,.28));
  color:#e9feff;
  border:1px solid rgba(47,214,208,.45);
  border-radius:12px 12px 3px 12px;
  padding:8px 11px;line-height:1.55;font-size:calc(12.5px * var(--scale));
  box-shadow:0 0 18px rgba(47,214,208,.12);
}
.msg-agent{margin-top:10px}
.msg-head{
  display:flex;align-items:center;gap:6px;
  margin-bottom:5px;
}
.avatar{
  width:19px;height:19px;border-radius:4px;flex:0 0 auto;
  background:linear-gradient(135deg,#2fd6d0,#0d7d84);
  color:#04141b;font-size:9px;font-weight:800;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;letter-spacing:-.4px;
  box-shadow:0 0 12px rgba(47,214,208,.4);
}
.who{font-size:calc(11px * var(--scale));font-weight:700;color:#cdf6f2;letter-spacing:.4px}
.focus-pill{
  font-family:var(--mono);font-size:calc(9.5px * var(--scale));
  color:#7fd8d2;background:rgba(47,214,208,.10);border:1px solid rgba(47,214,208,.25);
  border-radius:3px;padding:1px 5px;
  max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ========== 回答卡片 ========== */
.card{
  border:1px solid rgba(70,190,215,.18);
  border-left:3px solid var(--sea500);
  border-radius:3px 10px 10px 3px;
  background:linear-gradient(180deg, rgba(11,32,46,.96), rgba(8,24,35,.96));
  padding:9px 11px 10px;
  box-shadow:0 8px 22px rgba(0,0,0,.28), inset 0 0 24px rgba(47,214,208,.03);
}
.card.lvl-ok{border-left-color:var(--ok);box-shadow:0 8px 22px rgba(0,0,0,.28), inset 4px 0 14px rgba(61,220,151,.08)}
.card.lvl-warn{border-left-color:var(--warn);box-shadow:0 8px 22px rgba(0,0,0,.28), inset 4px 0 14px rgba(255,181,69,.08)}
.card.lvl-danger{border-left-color:var(--danger);box-shadow:0 8px 22px rgba(0,0,0,.28), inset 4px 0 14px rgba(255,95,109,.09)}

.card-title{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:calc(12.5px * var(--scale));font-weight:700;color:#e6fbff;
  margin-bottom:4px;letter-spacing:.3px;
}
.lvl{
  font-size:calc(9.5px * var(--scale));font-weight:700;letter-spacing:.5px;
  padding:2px 7px;border-radius:999px;
  background:rgba(61,220,151,.12);color:#6ff0b8;border:1px solid rgba(61,220,151,.4);
}
.lvl.warn{background:rgba(255,181,69,.12);color:#ffc76f;border-color:rgba(255,181,69,.42)}
.lvl.danger{background:rgba(255,95,109,.13);color:#ff8f99;border-color:rgba(255,95,109,.45)}
.summary{
  font-size:calc(12px * var(--scale));line-height:1.65;color:#b6d6e0;
  margin:2px 0 7px;
}
.summary b{color:#8ff0e8}

/* 指标表 */
table.kv{
  width:100%;border-collapse:collapse;
  font-size:calc(11px * var(--scale));margin:2px 0 6px;
}
table.kv th{
  text-align:left;font-weight:600;color:#6d95a6;
  padding:2px 4px;border-bottom:1px solid rgba(70,190,215,.22);white-space:nowrap;
  letter-spacing:.4px;
}
table.kv td{
  padding:2px 4px;border-bottom:1px dashed rgba(255,255,255,.07);color:#b8d7e1;
  font-family:var(--mono);font-size:calc(10.5px * var(--scale));
}
table.kv td.name{font-family:var(--sans);color:#dceff5;white-space:nowrap}
table.kv td.num{font-weight:700}
.stat-ok{color:#4ae0a0}
.stat-warn{color:#ffc76f}
.stat-danger{color:#ff828d}

/* 推理链 */
details.reason{
  margin:5px 0 6px;
  background:rgba(47,214,208,.045);border:1px solid rgba(70,190,215,.16);border-radius:6px;
  padding:5px 8px;
}
details.reason summary{
  cursor:pointer;font-size:calc(11px * var(--scale));font-weight:700;color:#7fe3dc;
  list-style:none;display:flex;align-items:center;gap:5px;
}
details.reason summary::-webkit-details-marker{display:none}
details.reason summary::before{
  content:"›";display:inline-block;transform:rotate(90deg);
  font-size:14px;line-height:1;color:var(--sea500);transition:transform .15s;
}
details.reason[open] summary::before{transform:rotate(-90deg)}
details.reason ol{margin:5px 0 2px 15px}
details.reason li{
  font-size:calc(11px * var(--scale));line-height:1.62;color:#a9cbd6;
  margin-bottom:2px;
}
details.reason li b{color:#8ff0e8}
.tag-mono{font-family:var(--mono);background:rgba(47,214,208,.12);border-radius:3px;padding:0 3px;color:#9ff0ea}

/* 建议 */
.acts{margin:4px 0 2px}
.acts h5{
  font-size:calc(10.5px * var(--scale));font-weight:700;color:#8fe9e2;
  letter-spacing:1px;margin-bottom:3px;
}
.acts ul{list-style:none}
.acts li{
  font-size:calc(11.5px * var(--scale));line-height:1.6;color:#b6d6e0;
  padding-left:13px;position:relative;margin-bottom:1px;
}
.acts li::before{
  content:"";position:absolute;left:2px;top:.62em;
  width:4px;height:4px;background:var(--sea500);box-shadow:0 0 6px rgba(47,214,208,.9);
}

/* 免责与来源 */
.caveat{
  margin-top:6px;padding-top:5px;border-top:1px dashed rgba(70,190,215,.2);
  font-size:calc(9.5px * var(--scale));line-height:1.55;color:#6d95a6;
}
.caveat b{color:#c9a75e;font-weight:600}

/* 追问 */
.follow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

/* ========== 等级角标 A/B/C/D ========== */
.grade{
  display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:3px;
  font-family:var(--mono);font-size:9px;font-weight:700;
  cursor:help;vertical-align:middle;margin-left:3px;
  border:1px solid transparent;
}
.g-A{background:rgba(61,220,151,.16);color:#6ff0b8;border-color:rgba(61,220,151,.42)}
.g-B{background:rgba(86,170,255,.16);color:#8fc6ff;border-color:rgba(86,170,255,.42)}
.g-C{background:rgba(255,181,69,.14);color:#ffc76f;border-color:rgba(255,181,69,.4)}
.g-D{background:rgba(160,180,195,.12);color:#a4bcc7;border-color:rgba(160,180,195,.32)}

/* ========== chip ========== */
.chip{
  font-family:var(--sans);font-size:calc(10.5px * var(--scale));
  color:#9fe7e0;background:rgba(13,40,54,.9);
  border:1px solid rgba(47,214,208,.25);border-radius:999px;
  padding:4px 9px;cursor:pointer;line-height:1.35;
  max-width:100%;text-align:left;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .1s;
}
.chip:hover{background:rgba(20,62,78,.95);border-color:rgba(47,214,208,.6);box-shadow:0 0 14px rgba(47,214,208,.18)}
.chip:active{transform:scale(.98)}
.chip kbd{
  font-family:var(--mono);font-size:9px;color:#04141b;background:var(--sea500);
  border-radius:3px;padding:0 3px;margin-right:4px;font-weight:700;
}

/* ========== KPI 卡 ========== */
.kpi-card{
  border:1px solid rgba(70,190,215,.16);border-radius:6px;
  padding:6px 8px;background:linear-gradient(180deg, rgba(12,34,48,.9), rgba(8,24,35,.9));
  position:relative;overflow:hidden;
}
.kpi-card::before{
  content:"";position:absolute;left:0;top:0;width:2px;height:100%;
  background:linear-gradient(180deg, var(--sea500), transparent);
  opacity:.5;
}

<script>
/* 00.store.js — 全局状态与轻量事件总线 */
window.LC = window.LC || {};

LC.Store = (function () {
  var KEY = 'lczn.v1.';
  var MEM = {};

  var S = {
    ctx: {
      zoneId: 'z_ruditapes',
      speciesId: 'philippinarum',
      season: '2026年秋季',
      lastWater: null,      // {level, summary, zoneId}
      lastFocus: null
    },
    history: [],
    prefs: { perf: false, proj: false },
    demo: false
  };

  var subs = [];

  function safeGet(k, dft) {
    try {
      var v = localStorage.getItem(KEY + k);
      return v == null ? dft : JSON.parse(v);
    } catch (e) {
      return Object.prototype.hasOwnProperty.call(MEM, k) ? MEM[k] : dft;
    }
  }

  function safeSet(k, v) {
    try {
      localStorage.setItem(KEY + k, JSON.stringify(v));
    } catch (e) {
      MEM[k] = v;   // 私密模式 / file:// 受限时降级为内存，不抛错
    }
  }

  function on(fn) { subs.push(fn); }
  function emit(evt, payload) {
    for (var i = 0; i < subs.length; i++) {
      try { subs[i](evt, payload); } catch (e) { /* 单个订阅失败不影响全局 */ }
    }
  }

  function zone() {
    return LC.ZONES_BY_ID[S.ctx.zoneId] || LC.ZONES[0];
  }

  function species() {
    return LC.SPECIES[S.ctx.speciesId] || null;
  }

  function focusText() {
    var z = zone();
    var sp = species();
    var nm = sp ? sp.name : (z ? z.speciesName : '');
    var parts = [z && z.landBase ? '滨海陆基园区' : '龙威牧场'];
    parts.push(z ? z.name : '');
    if (nm && (!z || z.name.indexOf(nm.slice(0, 2)) < 0)) parts.push(nm);
    parts.push(S.ctx.season);
    return '当前关注：' + parts.join(' · ');
  }

  function setZone(id, silent) {
    var z = LC.ZONES_BY_ID[id];
    if (!z) return;
    S.ctx.zoneId = id;
    if (z.speciesId && LC.SPECIES[z.speciesId]) S.ctx.speciesId = z.speciesId;
    if (!silent) emit('zone', id);
  }

  function reset(keepPrefs) {
    S.ctx = {
      zoneId: 'z_ruditapes',
      speciesId: 'philippinarum',
      season: '2026年秋季',
      lastWater: null,
      lastFocus: null
    };
    S.history = [];
    if (!keepPrefs) {
      S.prefs = { perf: false, proj: false };
      safeSet('prefs', S.prefs);
    }
    try { localStorage.removeItem(KEY + 'history'); } catch (e) { MEM.history = []; }
    emit('reset');
  }

  return {
    S: S, on: on, emit: emit,
    safeGet: safeGet, safeSet: safeSet,
    zone: zone, species: species, focusText: focusText,
    setZone: setZone, reset: reset
  };
})();

</script>

/* 04.engine.nlu.js — 意图识别与槽位抽取（规则驱动，可解释） */
window.LC = window.LC || {};

LC.NLU = (function () {

  var INTENTS = [
    { id: 'water.check', name: '水质综合评估', tool: 'assessWater', kw: {
        '溶解氧': 3, '溶氧': 3, '氨氮': 3, 'ph': 3, '亚硝酸盐': 3, '水质': 2,
        '缺氧': 2, '浮头': 2, '水色': 1, '超标': 1, '有没有事': 3, '要不要紧': 3 } },
    { id: 'feed.calc', name: '投饵决策', tool: 'calcFeed', kw: {
        '投饵': 4, '投喂': 4, '喂多少': 4, '饲料': 3, '吃料': 3, '还喂': 3, '喂': 2 } },
    { id: 'growth.predict', name: '生长与开捕预测', tool: 'predictGrowth', kw: {
        '壳长': 3, '体长': 3, '长到': 3, '养多久': 4, '要多久': 3, '多久': 2,

    { id: 'stock.assess', name: '资源量与捕捞策略', tool: 'assessStock', kw: {
        '捕捞死亡率': 5, '捕捞强度': 4, 'msy': 4, '资源量': 3, '可捕量': 3,
        '开捕': 2, '渔获': 2, '过度捕捞': 4 } },
    { id: 'redtide.risk', name: '赤潮风险评分', tool: 'scoreRedTide', kw: {
        '赤潮': 5, '水华': 4, '倒藻': 4, '藻华': 4, '发红': 2 } },
    { id: 'carbon.calc', name: '蓝碳核算', tool: 'calcBlueCarbon', kw: {
        '碳汇': 5, '蓝碳': 5, '固碳': 4, '碳中和': 4, '碳交易': 3 } },
    { id: 'release.plan', name: '增殖放流方案', tool: 'planRelease', kw: {

        '休渔': 5, '禁渔': 4, '能不能捕': 4, '能捕': 2, '违法': 3,
        '最小可捕': 4, '规格': 2, '渔业法': 3 } }
  ];

  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[\uFF01-\uFF5E]/g, function (c) {   // 全角转半角
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      })
      .replace(/\u3000/g, ' ')
      .toLowerCase();
  }

  /* 同义词归一：把口语说法收敛到标准词 */
  var SYN = [
    ['溶氧', '溶解氧'], ['do值', '溶解氧'],
    ['杂色蛤', '菲律宾蛤仔'], ['花蛤', '菲律宾蛤仔'], ['蛤蜊', '菲律宾蛤仔'],
    ['梭蟹', '梭子蟹'], ['白蟹', '梭子蟹'],
    ['舌鳎', '半滑舌鳎'], ['龙利', '半滑舌鳎'],
    ['白虾', '南美白对虾'], ['凡纳滨对虾', '南美白对虾'],
    ['倒藻', '倒藻']
  ];

  function normalizeSyn(t) {
    for (var i = 0; i < SYN.length; i++) {
      if (SYN[i][0] !== SYN[i][1] && t.indexOf(SYN[i][0]) >= 0) {
        t = t.split(SYN[i][0]).join(SYN[i][1]);
      }
    }
    return t;
  }

  function detectSpecies(t) {
    var best = null, bestLen = 0, sid = null;
    for (var k in LC.ALIAS_MAP) {
      if (t.indexOf(k) >= 0 && k.length > bestLen) { best = k; bestLen = k.length; sid = LC.ALIAS_MAP[k]; }
    }
    return sid;
  }

  function detectZone(t) {
    var m = t.match(/(\d+)\s*号塘/);
    if (m) return 'p_shrimp3';
    if (t.indexOf('车间') >= 0 || t.indexOf('循环水') >= 0) return 'p_sole';
    if (t.indexOf('鱼礁') >= 0) return 'z_reef';
    if (t.indexOf('牡蛎') >= 0) return 'z_ostrea';
    if (t.indexOf('四角蛤') >= 0) return 'z_mactra';
    if (t.indexOf('毛蚶') >= 0) return 'z_scapharca';
    if (t.indexOf('缢蛏') >= 0 || t.indexOf('蛏子') >= 0) return 'z_sinonovacula';
    if (t.indexOf('文蛤') >= 0) return 'z_meretrix';
    if (t.indexOf('青蛤') >= 0) return 'z_cyclina';
    if (t.indexOf('泥螺') >= 0) return 'z_bullacta';
    if (t.indexOf('蛤仔') >= 0) return 'z_ruditapes';
    return null;
  }

  function grabNum(t, re) {
    var m = t.match(re);
    if (!m) return null;
    var v = parseFloat(m[1]);
    return isNaN(v) ? null : v;
  }

  /* 长度统一换算为 mm */
  function grabLengths(t) {
    var out = [], re = /(\d+(?:\.\d+)?)\s*(厘米|cm|毫米|mm|公分)/gi, m;
    while ((m = re.exec(t)) !== null) {
      var v = parseFloat(m[1]);
      var unit = m[2].toLowerCase();
      if (unit === '厘米' || unit === 'cm' || unit === '公分') v = v * 10;
      out.push({ mm: v, raw: m[0] });
    }
    return out;
  }

  function parse(text, ctx) {
    var raw = String(text || '');
    var t = normalizeSyn(norm(raw));

    if (/^\s*(75|七十五)\s*$/.test(t)) return { intent: 'easter', slots: {}, raw: raw, t: t };
    if (/^\s*(你好|hi|hello|在吗)\s*$/.test(t)) return { intent: 'greet', slots: {}, raw: raw, t: t };
    if (/^\s*(帮助|help|能做什么|怎么用)\s*$/.test(t)) return { intent: 'help', slots: {}, raw: raw, t: t };

    /* 意图打分 */
    var best = { id: null, score: 0 }, second = { id: null, score: 0 };
    for (var i = 0; i < INTENTS.length; i++) {
      var it = INTENTS[i], sc = 0, hits = [];
      for (var k in it.kw) {
        if (t.indexOf(k) >= 0) { sc += it.kw[k]; hits.push(k); }
      }
      if (sc > best.score) { second = best; best = { id: it.id, score: sc, hits: hits }; }
      else if (sc > second.score) { second = { id: it.id, score: sc, hits: hits }; }
    }

    var slots = { speciesId: null, zoneId: null, nums: {}, lengths: [], F: null, sex: null };

    slots.speciesId = detectSpecies(t);
    slots.zoneId = detectZone(t);

    slots.nums.do   = grabNum(t, /(?:溶解氧|溶氧|do)\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
    slots.nums.ph   = grabNum(t, /ph\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
    slots.nums.tan  = grabNum(t, /(?:总氨氮|氨氮|tan)\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
    slots.nums.no2  = grabNum(t, /(?:亚硝酸盐氮|亚硝酸盐|no2)\s*[:：=]?\s*(\d+(?:\.\d+)?)/i);
    slots.nums.temp = grabNum(t, /(?:水温|温度)\s*[:：=]?\s*(\d+(?:\.\d+)?)/);
    slots.nums.sal  = grabNum(t, /(?:盐度)\s*[:：=]?\s*(\d+(?:\.\d+)?)/);

    slots.lengths = grabLengths(t);
    slots.F = grabNum(t, /(?:捕捞死亡率|捕捞强度|开发率|捕捞)\D{0,6}?(0?\.\d+|\d+(?:\.\d+)?)/i);
    if (slots.F != null && slots.F > 3) slots.F = null;   // 明显不是瞬时死亡系数

    if (t.indexOf('雌') >= 0) slots.sex = 'female';
    if (t.indexOf('雄') >= 0) slots.sex = 'male';

    slots.ctx = ctx || null;

    var resolved = best;
    if (best.score < 2) resolved = { id: 'help', score: 0, hits: [] };

    return {
      intent: resolved.id,
      score: best.score,
      second: second,
      ambiguous: second.score > 0 && best.score - second.score <= 1,
      slots: slots,
      raw: raw,
      t: t,
      intentName: (function () {
        for (var j = 0; j < INTENTS.length; j++) if (INTENTS[j].id === resolved.id) return INTENTS[j].name;
        return '通用应答';
      })()
    };
  }

  return { parse: parse, INTENTS: INTENTS, norm: norm };
})();
