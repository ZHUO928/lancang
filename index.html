<script>
/* 05.engine.tools.js — 领域工具函数（纯函数，无副作用） */
window.LC = window.LC || {};

LC.Tools = (function () {

  function f(v, n) {
    if (v == null || isNaN(v)) return '—';
    var d = n == null ? 1 : n;
    return Number(v).toFixed(d).replace(/\.0+$/, '');
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* 分子氨占比：Emerson 1975，pKa = 0.09018 + 2729.92/T(K) */
  function unionizedAmmoniaFraction(ph, tempC) {
    var pKa = 0.09018 + 2729.92 / (tempC + 273.15);
    return 1 / (1 + Math.pow(10, pKa - ph));
  }

  function rank(level) { return level === 'danger' ? 2 : level === 'warn' ? 1 : 0; }
  function worst(list) {
    var r = 0;
    for (var i = 0; i < list.length; i++) r = Math.max(r, rank(list[i]));
    return r === 2 ? 'danger' : r === 1 ? 'warn' : 'ok';
  }
  var LEVEL_TEXT = { ok: '正常', warn: '预警', danger: '危险' };
  var LEVEL_TEXT2 = { ok: '低风险', warn: '中高风险', danger: '高风险' };

  /* ============ 1. 水质综合评估 ============ */
  function assessWater(inp) {
    var sp = LC.SPECIES[inp.speciesId] || LC.SPECIES.vannamei;
    var w = sp.water;
    var temp = inp.temp != null ? inp.temp : 24;
    var rows = [], levels = [], reasoning = [], actions = [], chartRows = [];

    function pushRow(name, val, unit, ref, status, grade, basis) {
      rows.push({ name: name, value: val, unit: unit, ref: ref, status: status, grade: grade, basis: basis });
      chartRows.push({ name: name, value: parseFloat(val), ref: ref, status: status });
    }

    /* 溶解氧 */
    if (inp.do != null) {
      var t = w.do, st;
      if (inp.do < t.danger) st = 'danger';
      else if (inp.do < t.warn) st = 'warn';
      else st = 'ok';
      levels.push(st);
      pushRow('溶解氧', f(inp.do, 2), 'mg/L', '≥' + f(t.warn, 1) + '（最适 ' + t.opt[0] + '—' + t.opt[1] + '）', st, t.grade, t.basis);
      if (st !== 'ok') {
        reasoning.push('溶解氧 <b>' + f(inp.do, 2) + ' mg/L</b>，低于警戒线 ' + t.warn + '，' +
          (st === 'danger' ? '已进入危险区，须立即增氧。' : '尚未到危险线，但夜间还会继续下降。') + '（' + t.note + '）');
      }
    }

    /* pH */
    var phStatus = 'ok';
    if (inp.ph != null) {
      var p = w.ph;
      if (inp.ph >= p.dangerHigh || inp.ph <= p.dangerLow) phStatus = 'danger';
      else if (inp.ph >= p.warnHigh || inp.ph <= p.warnLow) phStatus = 'warn';
      levels.push(phStatus);
      pushRow('pH', f(inp.ph, 2), '', p.opt[0] + '—' + p.opt[1], phStatus, p.grade, p.basis);
      if (phStatus !== 'ok') {
        reasoning.push('pH <b>' + f(inp.ph, 2) + '</b> 超出适宜区间 ' + p.opt[0] + '—' + p.opt[1] +
          '：偏高的 pH 会让同一份总氨氮中的分子氨比例显著上升，是"看不见的毒性放大器"。');
      }
    }

    /* 总氨氮 + 分子氨耦合 */
    var nh3 = null, fnh3 = null, fnh3ref = null;
    if (inp.tan != null) {
      var a = w.tan, stA;
      if (inp.tan >= a.danger) stA = 'danger'; else if (inp.tan >= a.warn) stA = 'warn'; else stA = 'ok';
      levels.push(stA);
      pushRow('总氨氮', f(inp.tan, 2), 'mg/L', '<' + a.warn, stA, a.grade, a.basis);

      fnh3 = unionizedAmmoniaFraction(inp.ph != null ? inp.ph : 8.0, temp);
      fnh3ref = unionizedAmmoniaFraction(8.0, temp);
      nh3 = inp.tan * fnh3;
      var nh3st = nh3 >= w.nh3.danger ? 'danger' : nh3 >= w.nh3.safe ? 'warn' : 'ok';
      levels.push(nh3st);
      pushRow('分子氨 NH₃-N', f(nh3, 3), 'mg/L', '<' + w.nh3.safe, nh3st, w.nh3.grade, w.nh3.basis);

      reasoning.push('关键一步：总氨氮 <b>' + f(inp.tan, 2) + ' mg/L</b> 在 pH <b>' + f(inp.ph != null ? inp.ph : 8.0, 2) +
        '</b>、' + f(temp, 0) + '℃ 下，分子氨占比约 <b>' + f(fnh3 * 100, 1) + '%</b>，折算 NH₃-N ≈ <b>' +
        f(nh3, 3) + ' mg/L</b>，是控制值 ' + w.nh3.safe + ' 的 <b>' + f(nh3 / w.nh3.safe, 1) + ' 倍</b>。');
      if (inp.ph != null && inp.ph > 8.0) {
        reasoning.push('与 pH 8.0 相比，分子氨占比由 ' + f(fnh3ref * 100, 1) + '% 升至 ' + f(fnh3 * 100, 1) +
          '%，<b>放大约 ' + f(fnh3 / fnh3ref, 1) + ' 倍</b>。所以"氨氮略高 + pH 偏高"不是两个小问题相加，而是复合胁迫。');
      }
    }

    /* 亚硝酸盐 */
    if (inp.no2 != null) {
      var n2 = w.no2, st2;
      if (inp.no2 >= n2.danger) st2 = 'danger'; else if (inp.no2 >= n2.warn) st2 = 'warn'; else st2 = 'ok';
      levels.push(st2);
      pushRow('亚硝酸盐氮', f(inp.no2, 3), 'mg/L', '<' + n2.warn, st2, n2.grade, n2.basis);
      if (st2 !== 'ok' && inp.do != null && inp.do >= w.do.warn) {
        reasoning.push('注意一个经典误判：亚硝酸盐会氧化血蓝蛋白中的铜，造成<b>生理性缺氧</b>——水里的溶氧并不低，虾照样浮头。此时不能只看溶氧读数。');
      }
    }

    var level = worst(levels);
    var title = LEVEL_TEXT2[level];

    /* 处置建议 */
    if (inp.do != null && inp.do < w.do.warn) {
      actions.push('增氧机延长开机至凌晨 4—6 时（日最低点），必要时抛撒化学增氧剂应急。');
    }
    if (nh3 != null && nh3 >= w.nh3.safe) {
      actions.push('换水 10—20%（边排边进，避免温差与盐度骤变），随后泼洒芽孢杆菌 / EM 菌促降解。');
      actions.push('今日减料或停料一餐，减少残饵与排泄带来的氮负荷。');
    }
    if (phStatus !== 'ok' && inp.ph != null && inp.ph > 8.5) {
      actions.push('把投喂时间挪到傍晚，避开午后 pH 高峰；检查藻相与透明度，必要时局部杀藻后改水。');
    }
    if (!actions.length) actions.push('各项指标均在适宜区间，按常规管理并保持日巡塘记录。');

    var caveats = ['阈值为' + (sp.water.do.grade === 'C' ? '规程公认区间' : '文献值') + '，需按本场实测与本品种实际养殖阶段校准。'];
    if (inp.isDemo) caveats.unshift('本次读数为演示样例值，非现场实测。');

    /* 关键倍数大字卡：优先展示“分子氨放大”这一复合胁迫结论 */
    var cd = null;
    if (nh3 != null && nh3 >= w.nh3.safe) {
      cd = {
        type: 'callout', level: 'danger',
        label: '分子氨 NH₃-N / 控制值',
        value: f(nh3 / w.nh3.safe, 1) + ' 倍',
        unit: 'NH₃-N ≈ ' + f(nh3, 3) + ' mg/L　控制值 ' + w.nh3.safe + ' mg/L',
        sub: 'pH ' + f(inp.ph != null ? inp.ph : 8.0, 2) + ' 使毒性放大约 ' + f(fnh3 / fnh3ref, 1) + ' 倍'
      };
    } else if (inp.do != null) {
      cd = {
        type: 'callout', level: inp.do < w.do.danger ? 'danger' : inp.do < w.do.warn ? 'warn' : 'ok',
        label: '溶解氧 / 警戒线',
        value: f(inp.do / w.do.warn, 2) + ' 倍',
        unit: f(inp.do, 2) + ' mg/L　警戒 ' + w.do.warn + ' mg/L',
        sub: inp.do < w.do.warn ? '夜间仍会下降，需看凌晨最低值' : '当前高于警戒线'
      };
    }

    return {
      intent: 'water.check', tool: 'assessWater(' + sp.name + ')',
      title: '水质综合评估 · ' + sp.name, level: level, levelText: title,
      summary: '综合判定：<b>' + title + '</b>。' + (nh3 != null && nh3 >= w.nh3.safe
        ? '核心矛盾不是单项超标，而是 <b>pH 偏高把氨氮毒性放大了</b>。'
        : '按分项判定给出处置建议。'),
      rows: rows, reasoning: reasoning, actions: actions, caveats: caveats,
      chart: cd,
      follow: ['那这个塘今天还投饵吗？', '这个塘今晚要不要增氧？']
    };
  }

  /* ============ 2. 投饵决策 ============ */
  function tempFactor(sp, temp) {
    var o = sp.feed.tempOpt;
    if (temp <= 2) return 0;
    if (temp < o[0] - 10) return 0.2;
    if (temp < o[0] - 6) return 0.2 + (temp - (o[0] - 10)) / 4 * 0.25;
    if (temp < o[0]) return 0.45 + (temp - (o[0] - 6)) / 6 * 0.55;
    if (temp <= o[1]) return 1;
    if (temp <= o[1] + 5) return 1 - (temp - o[1]) / 5 * 0.25;
    return 0.5;
  }

  function calcFeed(inp) {
    var sp = LC.SPECIES[inp.speciesId] || LC.SPECIES.vannamei;

    if (!sp.feed.base) {
      return {
        intent: 'feed.calc', tool: 'calcFeed(' + sp.name + ')',
        title: '投饵决策 · ' + sp.name, level: 'ok', levelText: '无需投饵',
        summary: sp.name + ' 属<b>底播（或滤食性）</b>养殖，以水体天然饵料为主，<b>不需要人工投饵</b>。管理的重点不是"喂多少"，而是"饵料生物够不够"。',
        rows: [], reasoning: [
          '底播贝类通过滤食浮游植物与有机碎屑获取能量，投饵既无必要也会增加成本与富营养化风险。',
          '真正需要管的是：<b>水体透明度、叶绿素 a、流速与密度</b>——它们决定天然饵料的供给量。'
        ],
        actions: ['监测叶绿素 a 与透明度，透明度长期过高说明饵料不足，过低说明可能藻华。',
                  '按养殖容量控制底播密度，避免"越密越瘦"。',
                  '关注相邻区域赤潮与陆源排污对饵料质量的影响。'],
        caveats: ['底播贝类不投饵为养殖学常识，非模型计算结论。'],
        chart: null, follow: ['3号塘的对虾今天投饵吗？', '菲律宾蛤仔长到 4.5 厘米要多久？']
      };
    }

    var biomass = inp.biomassKg != null ? inp.biomassKg : 800;
    var avgW = inp.avgWeightG != null ? inp.avgWeightG : sp.feed.wref;
    var temp = inp.temp != null ? inp.temp : 25;
    var wl = inp.waterLevel || 'ok';

    var fT = tempFactor(sp, temp);
    var fW = Math.pow(avgW / sp.feed.wref, -0.2);
    var base = sp.feed.base;
    var raw = base * fT * fW;
    var wf = wl === 'danger' ? 0 : wl === 'warn' ? 0.6 : 1;
    var rate = raw * wf;
    var daily = biomass * rate / 100;
    var meals = sp.feed.meals;

    var rows = [
      { name: '存塘生物量', value: f(biomass, 0), unit: 'kg', ref: '示例假定' },
      { name: '平均体重', value: f(avgW, 0), unit: 'g', ref: '—' },
      { name: '水温', value: f(temp, 1), unit: '℃', ref: '适宜 ' + sp.feed.tempOpt[0] + '—' + sp.feed.tempOpt[1] },
      { name: '基准投饵率', value: f(base, 2), unit: '%/d', ref: '占存塘体重' },
      { name: '温度修正', value: '×' + f(fT, 2), unit: '', ref: '分段折线' },
      { name: '体重修正', value: '×' + f(fW, 2), unit: '', ref: '(W/' + sp.feed.wref + 'g)^-0.2' },
      { name: '水质折减', value: '×' + f(wf, 2), unit: '', ref: wl === 'ok' ? '水质正常' : '上轮水质判为' + LEVEL_TEXT2[wl] },
      { name: '日投饵量', value: f(daily, 1), unit: 'kg/d', ref: '分 ' + meals + ' 餐，每餐约 ' + f(daily / meals, 1) + ' kg' }
    ];

    var reasoning = [
      '日投饵率 = 基准投饵率 × 温度修正 × 体重修正 × 水质折减 = ' + f(base, 2) + '% × ' + f(fT, 2) + ' × ' + f(fW, 2) + ' × ' + f(wf, 2) + ' = <b>' + f(rate, 2) + '%</b>。',
      '体重修正取 -0.2 次幂：个体越小，单位体重的投饵率越高（' + f(avgW, 0) + ' g 对应 ×' + f(fW, 2) + '）。',
      wl === 'ok'
        ? '本轮未发现水质约束，按常态投喂。'
        : '水质判为' + LEVEL_TEXT2[wl] + '，按 ×' + f(wf, 2) + ' 折减——<b>先保水，再保料</b>。'
    ];

    if (wl !== 'ok') {
      reasoning.push('推理链：投饵量 ↑ → 残饵与排泄 ↑ → 氨氮 ↑ → 若 pH 同时偏高，分子氨毒性 ↑ → 必须同步增氧、换水、补菌。');
    }

    var actions = [];
    if (wf === 0) actions.push('建议<b>停料</b>，待水质恢复后从半量逐步复料。');
    else actions.push('日投饵量约 <b>' + f(daily, 1) + ' kg</b>，分 ' + meals + ' 餐，每餐约 ' + f(daily / meals, 1) + ' kg。');
    if (wl !== 'ok') actions.push('改到傍晚投喂，避开午后 pH 高峰；投喂后 1 小时查残饵，有剩料再减 10—20%。');
    actions.push('每 5—7 天抽样称重校正平均体重，投饵表随体重滚动更新。');

    return {
      intent: 'feed.calc', tool: 'calcFeed(' + sp.name + ')',
      title: '投饵决策 · ' + sp.name, level: wl === 'danger' ? 'danger' : wl === 'warn' ? 'warn' : 'ok',
      levelText: wl === 'danger' ? '建议停料' : wl === 'warn' ? '减量投喂' : '常规投喂',
      summary: '今日建议日投饵量约 <b>' + f(daily, 1) + ' kg</b>（占存塘 ' + f(rate, 2) + '%），分 ' + meals + ' 餐。' +
        (wl !== 'ok' ? '因上一轮水质判为' + LEVEL_TEXT2[wl] + '，已自动折减。' : ''),
      rows: rows, reasoning: reasoning, actions: actions,
      caveats: ['存塘量与均重为示例假定，请按实际盘点值替换。', '投饵率经验值需按摄食情况与残饵观察校准。'],
      chart: { type: 'feed', base: base, rate: rate, fT: fT, fW: fW, wf: wf },
      follow: ['再帮我看看这个塘的水质', '梭子蟹捕捞死亡率0.7，要调到多少？']
    };
  }

  /* ============ 3. 生长与开捕预测 ============ */
  function ageAtLength(g, Lmm) {
    return g.t0 - (1 / g.K) * Math.log(1 - Lmm / g.inf);
  }

  function predictGrowth(inp) {
    var sp = LC.SPECIES[inp.speciesId] || LC.SPECIES.philippinarum;

    if (!sp.growth) {
      return {
        intent: 'growth.predict', tool: 'predictGrowth(' + sp.name + ')',
        title: '生长预测 · ' + sp.name, level: 'warn', levelText: '参数未收录',
        summary: '本系统<b>没有收录 ' + sp.name + ' 可靠的生长参数</b>，因此不做生长外推。' +
          (sp.legal ? '合规判断仍可做：法定最小可捕为 ' + sp.legal.min.value + ' mm（' + sp.legal.min.measure + '）。' : ''),
        rows: sp.legal ? [{ name: '法定最小可捕', value: sp.legal.min.value, unit: 'mm', ref: sp.legal.min.measure, grade: sp.legal.grade, basis: sp.legal.basis }] : [],
        reasoning: ['（' + (sp.growthNote || '参数待补') + '）',
          '把参数留白，比套用邻近物种的参数更安全——错误的外推会直接导致错误的开捕决策。'],
        actions: ['如需该品种的生长曲线，建议以本海区标记放流或逐月采样数据自行拟合。'],
        caveats: ['本回答不构成开捕建议。'],
        chart: null, follow: ['菲律宾蛤仔长到 4.5 厘米要多久？']
      };
    }

    var g0 = sp.growth;
    var sexes = g0.sexes;
    var key = inp.sex && sexes[inp.sex] ? inp.sex : (sexes.all ? 'all' : (sexes.female ? 'female' : Object.keys(sexes)[0]));
    var g = sexes[key];

    var L1 = inp.fromMm, L2 = inp.toMm;
    if (L1 == null) L1 = Math.round(g.inf * 0.5);
    if (L2 == null) L2 = Math.round(L1 * 1.5);

    if (L2 >= g.inf || L1 >= g.inf) {
      return {
        intent: 'growth.predict', tool: 'predictGrowth(' + sp.name + ')',
        title: '生长预测 · ' + sp.name, level: 'warn', levelText: '超出模型适用范围',
        summary: '目标体长 ' + f(Math.max(L1, L2), 0) + ' mm 已达到或超过该模型的渐近体长 L∞ = ' + f(g.inf, 1) +
          ' mm，模型在此区间不适用。',
        rows: [{ name: 'L∞（渐近体长）', value: f(g.inf, 1), unit: 'mm', ref: '模型上限', grade: g0.grade, basis: g0.basis }],
        reasoning: ['von Bertalanffy 方程中 L∞ 是理论渐近值，实际个体不会超过它；超过即为参数或输入有误。'],
        actions: ['请核对输入体长与该海域的参数是否匹配。'],
        caveats: [g0.note || ''], chart: null, follow: []
      };
    }

    var t1 = ageAtLength(g, L1), t2 = ageAtLength(g, L2);
    var unitCn = g0.unit === 'day' ? '天' : '年';
    var delta = t2 - t1;
    var deltaCn = g0.unit === 'day' ? f(delta, 0) + ' 天（约 ' + f(delta / 365, 1) + ' 年）' : f(delta, 2) + ' 年';

    var rows = [
      { name: 'L∞（渐近体长）', value: f(g.inf, 1), unit: 'mm', grade: g0.grade, basis: g0.basis },
      { name: 'K（生长系数）', value: f(g.K, 4), unit: '/' + (g0.unit === 'day' ? 'd' : 'a'), ref: '注意：与 Schaefer 的环境容纳量 K 同名不同义' },
      { name: 't0', value: f(g.t0, 2), unit: unitCn, ref: g0.unit === 'day' ? '为正值，表示孵化前的理论零点' : '理论零龄' },
      { name: '起始 ' + f(L1, 1) + ' mm', value: f(t1, 2), unit: unitCn, ref: '反解年龄' },
      { name: '目标 ' + f(L2, 1) + ' mm', value: f(t2, 2), unit: unitCn, ref: '反解年龄' },
      { name: '所需时间', value: deltaCn, unit: '', ref: '≈ ' + f(delta, 2) + ' ' + unitCn }
    ];

    var reasoning = [
      '反解 von Bertalanffy：<b>t = t0 − (1/K)·ln(1 − L/L∞)</b>',
      '代入（' + g.label + '）：L∞=' + f(g.inf, 1) + ' mm，K=' + f(g.K, 4) + ' /' + (g0.unit === 'day' ? 'd' : 'a') + '，t0=' + f(g.t0, 2) + ' ' + unitCn,
      f(L1, 1) + ' mm → t₁ ≈ <b>' + f(t1, 2) + ' ' + unitCn + '</b>；' + f(L2, 1) + ' mm → t₂ ≈ <b>' + f(t2, 2) + ' ' + unitCn + '</b>',
      '所需时间 ≈ <b>' + deltaCn + '</b>'
    ];

    if (g0.unit === 'day') {
      reasoning.push('⚠ 单位校验：本种为一年生，K 与 t0 以<b>天</b>为单位，t0 为正数（约 ' + f(g.t0, 0) + ' 天）。若误按"年"代入，会得到"要长几十年"的荒谬结果——所以本系统的参数结构强制带单位字段，入口做断言。');
    }

    var actions = [];
    if (sp.legal) {
      var okLegal = L2 >= sp.legal.min.value;
      actions.push('合规判断：目标 ' + f(L2, 1) + ' mm ' + (okLegal ? '<b>已达</b>' : '<b>未达</b>') + ' 法定最小可捕 ' +
        sp.legal.min.value + ' mm（' + sp.legal.min.measure + '）。');
    }
    if (sp.bioOpt) {
      var okOpt = L2 >= sp.bioOpt.value;
      actions.push('生物学判断：文献建议开捕 ' + sp.bioOpt.value + ' mm，目标规格' + (okOpt ? '<b>已达到</b>' : '<b>尚未达到</b>') +
        '；两者相差 ' + f(sp.bioOpt.value - (sp.legal ? sp.legal.min.value : 0), 1) + ' mm。' +
        (sp.bioOpt.note ? '（' + sp.bioOpt.note + '）' : ''));
    }
    actions.push('实际开捕还应结合肥满度（出肉率）与当期价格，而不是只看壳长。');

    return {
      intent: 'growth.predict', tool: 'predictGrowth(' + sp.name + ')',
      title: '生长与开捕预测 · ' + sp.name + '（' + g.label + '）',
      level: 'ok', levelText: '模型计算',
      summary: '从 <b>' + f(L1, 1) + ' mm</b> 长到 <b>' + f(L2, 1) + ' mm</b>，按 von Bertalanffy 方程约需 <b>' + deltaCn + '</b>。',
      rows: rows, reasoning: reasoning, actions: actions,
      caveats: [g0.basis + '。', g0.note || '', '反解结果为群体平均，个体差异与养殖密度、饵料条件相关。'],
      chart: { type: 'growth', g: g, unit: g0.unit, key: key, l1: L1, l2: L2, t1: t1, t2: t2, name: sp.name },
      follow: ['贝类到底算不算碳汇？', '这个规格能捕吗？']
    };
  }

  /* ============ 4. 资源量与捕捞策略 ============ */
  function assessStock(inp) {
    var sp = LC.SPECIES[inp.speciesId] || LC.SPECIES.portunus;
    var st = (sp.growth && sp.growth.stock) ? sp.growth.stock : { r: 0.7, rBasis: '演示取 r≈M', M: 0.7, E: 0.5 };
    var r = inp.r != null ? inp.r : st.r;
    var K = 100;                       // 相对生物量单位
    var F = inp.F != null ? inp.F : (st.E || 0.5);
    var Fmsy = r / 2, MSY = r * K / 4;
    var Y = F <= r ? F * K * (1 - F / r) : 0;
    var ratio = F / Fmsy;

    var level = ratio > 1.5 ? 'danger' : ratio > 1.05 ? 'warn' : 'ok';
    var verdict = ratio > 1.5 ? '已进入过度捕捞区' : ratio > 1.05 ? '略高于最适捕捞强度' : '处于可持续区间';
    if (F >= r) verdict = '资源崩溃临界点，平衡渔获量为 0';

    var rows = [
      { name: '内禀增长率 r', value: f(r, 2), unit: '/a', ref: '本演示取 r≈M' },
      { name: '环境容纳量 K', value: f(K, 0), unit: '相对', ref: '相对生物量，仅示模型形态' },
      { name: '当前捕捞死亡 F', value: f(F, 2), unit: '/a', ref: '输入值' },
      { name: 'F_MSY = r/2', value: f(Fmsy, 2), unit: '/a', ref: '最适捕捞死亡' },
      { name: 'MSY = rK/4', value: f(MSY, 1), unit: '相对', ref: '最大可持续产量' },
      { name: '当前平衡渔获 Y', value: f(Y, 1), unit: '相对', ref: 'Y=F·K(1−F/r)' },
      { name: '开发率 E', value: f(F / (F + (st.M || r)), 2), unit: '', ref: 'E=F/Z，莱州湾梭子蟹约 0.50' }
    ];

    var reasoning = [
      '① Logistic 增长：dN/dt = rN(1 − N/K)',
      '② 加入捕捞死亡 F，平衡态下 N* = K(1 − F/r)',
      '③ 平衡渔获量 Y(F) = F·N* = F·K(1 − F/r)，是一条关于 F 的抛物线',
      '④ 顶点：<b>F_MSY = r/2</b>，<b>MSY = rK/4</b>，对应生物量 B_MSY = K/2',
      '代入当前值：F=' + f(F, 2) + '，F_MSY=' + f(Fmsy, 2) + '，即当前捕捞强度为最适值的 <b>' + f(ratio, 2) + ' 倍</b>'
    ];

    var actions = [];
    if (ratio > 1.05) {
      actions.push('捕捞努力量压减约 <b>' + f((1 - Fmsy / F) * 100, 0) + '%</b>，使 F 回落到 ' + f(Fmsy, 2) + ' 附近。');
      actions.push('严格执行最小可捕 ' + (sp.legal ? sp.legal.min.value + ' mm（' + sp.legal.min.measure + '）' : '规格') + '，给补充群体留出至少一次繁殖机会。');
      actions.push('伏季休渔期（5/1—9/1）与增殖放流同步推进，缩短资源恢复周期。');
    } else {
      actions.push('当前强度下可维持产量，重点转向监测：每年更新生长参数与死亡系数，防止参数漂移。');
    }
    actions.push('建立 CPUE 与年龄结构的年度监测，这比单点产量更能提前预警。');

    return {
      intent: 'stock.assess', tool: 'assessStock(' + sp.name + ')',
      title: '资源量与捕捞策略 · ' + sp.name, level: level, levelText: verdict,
      summary: '当前 F = <b>' + f(F, 2) + '</b>，为 F_MSY（' + f(Fmsy, 2) + '）的 <b>' + f(ratio, 2) + ' 倍</b>，' + verdict + '。',
      rows: rows, reasoning: reasoning, actions: actions,
      caveats: [
        st.rBasis || 'r 为演示取值。',
        'r ≈ M 只是经验近似；正式资源评估需年龄结构数据与单位补充量渔获量（Y/R）分析。',
        'K 为相对单位，仅用于展示模型形态，不代表真实生物量。'
      ],
      chart: { type: 'schaefer', r: r, K: K, F: F, Fmsy: Fmsy, MSY: MSY, ratio: ratio },
      follow: ['休渔期是什么时候？', '菲律宾蛤仔长到 4.5 厘米要多久？']
    };
  }

  /* ============ 5. 赤潮风险评分 ============ */
  function scoreRedTide(inp) {
    var z = LC.ZONES_BY_ID[inp.zoneId] || LC.ZONES[1];
    var chl = inp.chl != null ? inp.chl : (z.kpi.chl || 3.5);
    var doSwing = inp.doSwing != null ? inp.doSwing : 2.4;
    var din = inp.din != null ? inp.din : 0.26;
    var temp = inp.temp != null ? inp.temp : z.kpi.temp;
    var parts = [];

    var sChl = chl < 2 ? 0 : chl < 5 ? (chl - 2) / 3 * 10 : chl < 10 ? 10 + (chl - 5) / 5 * 15 : 30;
    parts.push({ name: '叶绿素 a', value: f(chl, 1) + ' μg/L', score: sChl, max: 30, note: chl >= 5 ? '已达富营养化提示水平' : '处于常态区间' });

    var sT = (temp >= 20 && temp <= 28) ? 20 : ((temp >= 15 && temp < 20) || (temp > 28 && temp <= 32)) ? 12 : 3;
    parts.push({ name: '水温', value: f(temp, 1) + '℃', score: sT, max: 20, note: (temp >= 20 && temp <= 28) ? '处于甲藻/硅藻活跃温窗' : '偏离主要赤潮温窗' });

    var sN = din < 0.2 ? 0 : din < 0.3 ? 12 : 25;
    parts.push({ name: '无机氮 DIN', value: f(din, 2) + ' mg/L', score: sN, max: 25, note: din >= 0.3 ? '超过近岸均值 0.33 的量级' : '接近近岸常态' });

    var sDO = doSwing < 2 ? 0 : doSwing < 3 ? 8 : 15;
    parts.push({ name: '溶解氧昼夜差', value: f(doSwing, 1) + ' mg/L', score: sDO, max: 15, note: doSwing >= 3 ? '白天过饱和 / 夜间骤降，是藻华信号' : '昼夜波动正常' });

    var sW = 6;
    parts.push({ name: '气象条件', value: inp.weather || '连续晴热少风', score: sW, max: 10, note: '晴热少风利于藻类聚集；暴雨后 3 日内陆源营养盐输入也会抬升风险' });

    var total = 0;
    for (var i = 0; i < parts.length; i++) total += parts[i].score;
    total = clamp(Math.round(total), 0, 100);

    var level = total < 30 ? 'ok' : total < 50 ? 'warn' : total < 70 ? 'warn' : 'danger';
    var levelText = total < 30 ? '低' : total < 50 ? '中' : total < 70 ? '高' : '极高';

    parts.sort(function (a, b) { return b.score / b.max - a.score / a.max; });
    var top = parts.slice(0, 2);

    return {
      intent: 'redtide.risk', tool: 'scoreRedTide(' + z.name + ')',
      title: '赤潮风险评分 · ' + z.name, level: level, levelText: '风险' + levelText + '（' + total + '/100）',
      summary: '综合风险指数 <b>' + total + ' / 100</b>，等级<b>' + levelText + '</b>。主导因子：<b>' +
        top[0].name + '</b>、<b>' + top[1].name + '</b>。',
      rows: parts.map(function (p) {
        return { name: p.name, value: p.value, unit: '', ref: p.score + '/' + p.max + ' 分 · ' + p.note };
      }),
      reasoning: [
        '评分 = Σ（各因子得分 × 权重），权重按叶绿素 a 30、水温 20、无机氮 25、溶解氧昼夜差 15、气象 10 分配。',
        '叶绿素 a 得 ' + f(parts[0].score, 0) + ' 分（该项满分 ' + parts[0].max + '），是最主要的贡献项。',
        '莱州湾近年水体环境持续改善，但仍处轻度富营养化、且多为<b>磷限制</b>，因此氮磷比失衡本身也是信号。'
      ],
      actions: total >= 50
        ? ['加密巡塘至每日 1 次，重点看水色、透明度与下风处气味。', '暂停大规模换水，避免把高藻水引入其他塘口。', '准备增氧与改水物资；如出现鱼虾异常浮头，立即取样送检。']
        : ['维持常规巡塘频次，记录水色与透明度。', '关注连续晴热与暴雨后 3 天两个高风险窗口。'],
      caveats: [
        '⚠ 本评分为基于公开阈值的相对风险指数，用于教学演示与巡塘提示，<b>不构成赤潮预报</b>。',
        '业务级赤潮预警需卫星遥感、浮标连续监测与数值模型同化。',
        '置信度：低（启发式评分，非统计模型）。'
      ],
      chart: { type: 'score', parts: parts, total: total },
      follow: ['这个区水质怎么样？', '贝类到底算不算碳汇？']
    };
  }

  /* ============ 6. 蓝碳核算（三尺度） ============ */
  function calcBlueCarbon(inp) {
    var z = LC.ZONES_BY_ID[inp.zoneId] || LC.ZONES[1];
    var areaWan = inp.areaWan != null ? inp.areaWan : (z.areaWan || 0.75);
    var areaHa = areaWan * 666.7;

    return {
      intent: 'carbon.calc', tool: 'calcBlueCarbon(' + z.name + ')',
      title: '蓝碳核算 · ' + z.name + '（' + f(areaWan, 2) + ' 万亩 ≈ ' + f(areaHa, 0) + ' 公顷）',
      level: 'warn', levelText: '条件性碳汇',
      summary: '贝类到底算不算碳汇？<b>答案取决于你在哪个尺度上算。</b>本系统不替你选边，而是把三个尺度分开列，并各自标注置信度。',
      rows: [],
      scales: LC.CARBON.scales,
      debate: LC.CARBON.debate,
      algae: LC.CARBON.algae,
      conclusion: LC.CARBON.conclusion,
      reasoning: [
        '生物体尺度：钙化 <b>Ca²⁺ + 2HCO₃⁻ → CaCO₃ + CO₂ + H₂O</b>，每 1 mol CaCO₃ 伴随约 1 mol CO₂，按质量计约 0.4—0.6 t CO₂ / t CaCO₃。此尺度是碳源。',
        '养殖区尺度：钙化与呼吸占优，可能表现为相对碳源；但滤食促进初级生产、粪便形成生物沉积，方向取决于密度与水文。',
        '生态系统尺度：把外围"施肥效应"与沉积埋藏、收获移出碳一并计入，多数研究认为整体可为净碳汇。',
        '所以"贝类碳汇系数"这个说法本身不严谨——必须说明是哪个尺度、哪个边界。'
      ],
      actions: [
        '<b>不提供</b>由面积直接乘单一系数的汇总值：那正是国际上被批评的算法。',
        '若用于生态价值核算，可按"条件性碳汇"表述，并注明尺度与置信度。',
        '若用于碳交易计量，须实测水—气界面 CO₂ 通量、核算收获移出碳与沉积埋藏。',
        '大型海藻养殖单列为"渔业碳汇（待验证）"，不与 IPCC 蓝碳混算。'
      ],
      caveats: [LC.CARBON.conclusion, LC.CARBON.basis + '。', '置信度：分尺度标注（高 / 低 / 中）。'],
      chart: null,
      follow: ['赤潮风险高吗？', '这个区水质怎么样？']
    };
  }

  /* ============ 7. 增殖放流方案 ============ */
  function planRelease(inp) {
    var sp = LC.SPECIES[inp.speciesId];
    var z = LC.ZONES_BY_ID[inp.zoneId] || LC.ZONES[1];
    var row = null, list = LC.RELEASE.species;
    for (var i = 0; i < list.length; i++) {
      if (sp && list[i].id === sp.id) row = list[i];
      if (!sp && list[i].name === '中国对虾') row = row || list[i];
    }
    if (!row) row = list[0];

    return {
      intent: 'release.plan', tool: 'planRelease(' + row.name + ')',
      title: '增殖放流方案 · ' + row.name, level: 'ok', levelText: '规划参考',
      summary: '参考规格 <b>' + row.spec + '</b>，时间窗 <b>' + row.season + '</b>，适宜生境：' + row.habitat + '。',
      rows: [
        { name: '放流品种', value: row.name, unit: '', ref: row.note },
        { name: '参考规格', value: row.spec, unit: '', ref: '以当年招标文件为准', grade: LC.RELEASE.grade, basis: LC.RELEASE.basis },
        { name: '时间窗', value: row.season, unit: '', ref: '与伏季休渔期重叠，利于成活' },
        { name: '适宜生境', value: row.habitat, unit: '', ref: '需避开强流区与敌害密集区' },
        { name: '拟放流区', value: z.name, unit: '', ref: f(z.areaWan, 2) + ' 万亩' }
      ],
      reasoning: [
        '为什么放流要算，而不是拍脑袋：山东放流的中国对虾约占近海资源量的 <b>97%</b>——放多少、放哪里、放什么规格，直接决定这片海的资源结构。',
        '规格与时间窗共同决定成活率：规格过小则敌害与潮流损失大，过大则成本高、且与自然群体竞争。',
        '放流点应选在<b>饵料生物丰富、流速适中、底质适宜</b>的海区，并与人工鱼礁、海草床形成组合。'
      ],
      actions: [
        '放流前：苗种检疫（品相、病害、药残）+ 暂养适应，第三方监理旁站核验数量与规格。',
        '放流中：选涨潮时段、贴近水面缓放，避免机械损伤；分区分批，不集中堆放在一处。',
        '放流后：休渔期内禁止有害作业；开展跟踪监测。',
        '效果评估：' + LC.RELEASE.eval.join('；') + '。'
      ],
      caveats: [LC.RELEASE.note, '放流数量须按当年省级方案与招标文件确定，本系统不做拍脑袋估算。'],
      chart: null,
      follow: ['休渔期是什么时候？', '梭子蟹捕捞死亡率0.7，要调到多少？']
    };
  }

  /* ============ 8. 渔政合规查询 ============ */
  function queryPolicy(inp) {
    var sp = LC.SPECIES[inp.speciesId];
    var rows = [], actions = [];

    var hit = null;
    if (sp) {
      for (var i = 0; i < LC.LAW.minSize.length; i++) {
        if (LC.LAW.minSize[i].name === sp.name || LC.LAW.minSize[i].name.indexOf(sp.name) >= 0) { hit = LC.LAW.minSize[i]; break; }
      }
    }

    rows.push({ name: '海洋伏季休渔', value: LC.LAW.rest.period, unit: '', ref: '北纬 35° 以北渤海与黄海', grade: 'A', basis: LC.LAW.rest.basis });
    rows.push({ name: '小型张网渔船', value: LC.LAW.rest.smallNet, unit: '', ref: '专项捕捞另有许可' });

    if (hit) {
      rows.push({ name: '最小可捕 · ' + hit.name, value: hit.spec, unit: '', ref: hit.measure, grade: 'A', basis: LC.LAW.minSizeBasis });
      actions.push('未达法定规格（' + hit.spec + '）的个体应<b>立即放归</b>，并尽量缩短离水时间。');
    } else if (sp) {
      rows.push({ name: '最小可捕', value: '本表未收录', unit: '', ref: '请查当年省级公告' });
    }

    rows.push({ name: '新《渔业法》施行', value: LC.LAW.newLaw.effect, unit: '', ref: '2025-12-27 修订通过，7 章 90 条', grade: 'A', basis: LC.LAW.newLaw.basis });

    actions.push('出海前核对：船证、作业类型、禁渔区与禁渔期、网具最小网目尺寸。');
    actions.push('保存渔获物定点上岸与日报记录，专项捕捞须持许可。');
    actions.push('增殖放流、海洋牧场、人工鱼礁、海藻场/海草床修复已写入新法，合规项目可获支持。');

    return {
      intent: 'policy.query', tool: 'queryPolicy(' + (sp ? sp.name : '通用') + ')',
      title: '渔政合规查询' + (sp ? ' · ' + sp.name : ''), level: 'ok', levelText: '合规提示',
      summary: '休渔期 <b>' + LC.LAW.rest.period + '</b>' + (hit ? '；最小可捕 <b>' + hit.spec + '</b>' : '') +
        '。新《渔业法》已于 <b>2026 年 5 月 1 日</b> 施行，本系统合规库已同步。',
      rows: rows,
      reasoning: [
        '休渔制度与最小可捕规格是"秋后算账"的两条硬线：前者管时间，后者管个体大小。',
        '新法把<b>渔业船网工具指标</b>和<b>重要渔业水域</b>写入制度，意味着"能不能出海"从船的层面前移到指标与水域的层面。'
      ],
      actions: actions,
      caveats: [LC.LAW.minSizeNote, '本回答为合规提示，不构成法律意见。'],
      chart: null,
      follow: ['增殖放流怎么放？', '梭子蟹捕捞死亡率0.7，要调到多少？']
    };
  }

  return {
    unionizedAmmoniaFraction: unionizedAmmoniaFraction,
    assessWater: assessWater, calcFeed: calcFeed, predictGrowth: predictGrowth,
    assessStock: assessStock, scoreRedTide: scoreRedTide,
    calcBlueCarbon: calcBlueCarbon, planRelease: planRelease, queryPolicy: queryPolicy
  };
})();

</script>
<script>
/* 06.engine.template.js — 结构化结果 → HTML */
window.LC = window.LC || {};

LC.Tpl = (function () {

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function gradeBadge(g, basis) {
    if (!g) return '';
    var def = LC.GRADE_DEF[g] || '';
    var title = (basis ? basis + '　|　' : '') + def;
    return '<span class="grade g-' + g + '" title="' + esc(title) + '">' + g + '</span>';
  }

  var ST = { ok: 'stat-ok', warn: 'stat-warn', danger: 'stat-danger' };
  var ST_TXT = { ok: '正常', warn: '预警', danger: '超限' };

  function rowsTable(rows) {
    if (!rows || !rows.length) return '';
    var h = '<table class="kv"><thead><tr><th>指标</th><th>数值</th><th>参照 / 说明</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var val = esc(r.value) + (r.unit ? ' <span style="opacity:.6">' + esc(r.unit) + '</span>' : '');
      if (r.status) {
        val = '<span class="' + (ST[r.status] || '') + '">' + val + '</span>' +
          ' <span class="' + (ST[r.status] || '') + '" style="font-size:9px">' + ST_TXT[r.status] + '</span>';
      }
      h += '<tr><td class="name">' + esc(r.name) + gradeBadge(r.grade, r.basis) + '</td>' +
           '<td class="num">' + val + '</td>' +
           '<td>' + esc(r.ref || '') + '</td></tr>';
    }
    return h + '</tbody></table>';
  }

  function reasonBlock(list) {
    if (!list || !list.length) return '';
    var h = '<details class="reason" open><summary>推理链 · ' + list.length + ' 步</summary><ol>';
    for (var i = 0; i < list.length; i++) {
      if (!list[i]) continue;
      h += '<li>' + list[i] + '</li>';
    }
    return h + '</ol></details>';
  }

  function actsBlock(list) {
    if (!list || !list.length) return '';
    var h = '<div class="acts"><h5>处置建议</h5><ul>';
    for (var i = 0; i < list.length; i++) h += '<li>' + list[i] + '</li>';
    return h + '</ul></div>';
  }

  function carbonBlock(res) {
    var h = '<div style="display:grid;gap:6px;margin:6px 0 4px">';
    for (var i = 0; i < res.scales.length; i++) {
      var s = res.scales[i];
      var cls = s.verdictLevel === 'danger' ? 'danger' : s.verdictLevel === 'warn' ? 'warn' : '';
      var color = s.verdictLevel === 'danger' ? '#ff828d' : s.verdictLevel === 'warn' ? '#ffc76f' : '#4ae0a0';
      h += '<div style="border:1px solid rgba(70,190,215,.18);border-left:3px solid ' + color + ';border-radius:0 8px 8px 0;padding:7px 9px;background:rgba(12,34,48,.7)">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">' +
        '<b style="font-size:calc(11.5px * var(--scale));color:#dff7fb">' + esc(s.name) + '</b>' +
        '<span style="font-size:calc(10px * var(--scale));font-weight:700;color:' + color + '">' + esc(s.verdict) + '</span>' +
        '<span style="margin-left:auto;font-size:calc(9px * var(--scale));color:#6d95a6">置信度：' + esc(s.conf) + '</span>' +
        '</div>' +
        '<div style="font-size:calc(10.5px * var(--scale));line-height:1.62;color:#a9cbd6">' + esc(s.text) + '</div>' +
        '</div>';
    }
    h += '</div>';
    h += '<div class="caveat" style="border-top:1px dashed rgba(70,190,215,.22);margin-top:4px">' +
      '<b>争议双方：</b><br>· ' + esc(res.debate[0]) + '<br>· ' + esc(res.debate[1]) + '</div>';
    h += '<div class="caveat"><b>海藻口径：</b>' + esc(res.algae) + '</div>';
    return h;
  }

  function render(res, focus) {
    if (!res) return '';
    var lvl = res.level || 'ok';
    var chart = res.chart ? LC.Chart.render(res.chart) : '';

    var h = '<div class="msg msg-agent"><div class="msg-head">' +
      '<span class="avatar">智能</span><span class="who">蓝仓智脑</span>' +
      '<span class="focus-pill">' + esc(focus) + '</span></div>';

    h += '<div class="card lvl-' + lvl + '">';
    h += '<div class="card-title">' + esc(res.title) +
      '<span class="lvl ' + (lvl === 'ok' ? '' : lvl) + '">' + esc(res.levelText || '') + '</span></div>';
    h += '<div class="summary">' + res.summary + '</div>';
    h += rowsTable(res.rows);
    if (res.intent === 'carbon.calc') h += carbonBlock(res);
    if (chart) h += '<div class="answer-chart">' + chart + '</div>';
    h += reasonBlock(res.reasoning);
    h += actsBlock(res.actions);
    if (res.conclusion) h += '<div class="caveat"><b>结论：</b>' + esc(res.conclusion) + '</div>';
    if (res.caveats && res.caveats.length) {
      var cs = [];
      for (var i = 0; i < res.caveats.length; i++) if (res.caveats[i]) cs.push(res.caveats[i]);
      if (cs.length) h += '<div class="caveat">' + cs.join('<br>') + '</div>';
    }
    if (res.follow && res.follow.length) {
      h += '<div class="follow">';
      for (var j = 0; j < res.follow.length; j++) {
        h += '<button type="button" class="chip" data-ask="' + esc(res.follow[j]) + '">' + esc(res.follow[j]) + '</button>';
      }
      h += '</div>';
    }
    return h + '</div></div>';
  }

  function userMsg(text) {
    return '<div class="msg msg-user"><div class="bubble">' + esc(text) + '</div></div>';
  }

  function easter() {
    return '<div class="msg msg-agent"><div class="msg-head">' +
      '<span class="avatar">智能</span><span class="who">蓝仓智脑</span></div>' +
      '<div class="anniv">' +
      '<div class="y">1951 — 2026</div>' +
      '<div class="t">潍坊学院办学七十五周年</div>' +
      '<div class="line"></div>' +
      '<div class="s">七十五年前，先辈在昌潍大地上点起一盏灯；<br>' +
      '七十五年后，我们把一盏灯放进了莱州湾的浮标里。<br>' +
      '它不连云，不联网。就算整片海面断了信号，它还在算。</div>' +
      '</div></div>';
  }

  function help() {
    return '<div class="msg msg-agent"><div class="msg-head">' +
      '<span class="avatar">智能</span><span class="who">蓝仓智脑</span></div>' +
      '<div class="card lvl-ok">' +
      '<div class="card-title">我能做这八件事</div>' +
      '<table class="kv"><tbody>' +
      '<tr><td class="name">水质综合评估</td><td>溶解氧 / pH / 氨氮 / 亚硝酸盐，含分子氨换算</td></tr>' +
      '<tr><td class="name">投饵决策</td><td>按体重、水温、水质折减算日投饵量</td></tr>' +
      '<tr><td class="name">生长与开捕预测</td><td>von Bertalanffy 反解 + 法定规格比对</td></tr>' +
      '<tr><td class="name">资源量与捕捞策略</td><td>Schaefer 剩余产量模型、MSY、F_MSY</td></tr>' +
      '<tr><td class="name">赤潮风险评分</td><td>多因子加权，输出主导因子</td></tr>' +
      '<tr><td class="name">蓝碳核算</td><td>生物体 / 养殖区 / 生态系统 三尺度分列</td></tr>' +
      '<tr><td class="name">增殖放流方案</td><td>规格、时间窗、效果评估指标</td></tr>' +
      '<tr><td class="name">渔政合规查询</td><td>休渔期、最小可捕、新《渔业法》</td></tr>' +
      '</tbody></table>' +
      '<div class="caveat">直接说人话就行，比如"3号塘溶氧4.2，pH8.9，氨氮0.45，虾有没有事？"。' +
      '它会记住你正在关注哪个区、哪个品种。</div>' +
      '</div></div>';
  }

  return { render: render, userMsg: userMsg, easter: easter, help: help, esc: esc, gradeBadge: gradeBadge };
})();

</script>
<script>
/* 07.ui.chart.js — 手写 SVG 图表（零第三方库） */
window.LC = window.LC || {};

LC.Chart = (function () {

  var C = {
    ink: '#dceff5', ink3: '#6d95a6', grid: 'rgba(70,190,215,.14)',
    sea: '#8ff0e8', sea5: '#2fd6d0', sea3: '#1f6f7e',
    ok: '#3ddc97', warn: '#ffb545', danger: '#ff5f6d'
  };

  function n(v, d) {
    if (v == null || isNaN(v)) return '—';
    return Number(v).toFixed(d == null ? 1 : d).replace(/\.0+$/, '');
  }

  function wrap(inner, w, h) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" ' +
      'font-family="Microsoft YaHei,PingFang SC,sans-serif" role="img">' + inner + '</svg>';
  }

  /* ---------- 大字提示 ---------- */
  function callout(d) {
    var color = d.level === 'danger' ? C.danger : d.level === 'warn' ? C.warn : C.ok;
    var w = 340, h = 78;
    var s = '';
    s += '<rect x="0.5" y="0.5" width="' + (w - 1) + '" height="' + (h - 1) + '" rx="8" fill="rgba(12,34,48,.72)" stroke="rgba(70,190,215,.22)"/>';
    s += '<rect x="0.5" y="0.5" width="4" height="' + (h - 1) + '" rx="2" fill="' + color + '"/>';
    s += '<text x="16" y="20" font-size="10" fill="' + C.ink3 + '">' + d.label + '</text>';
    s += '<text x="16" y="48" font-size="22" font-weight="700" fill="' + color + '" font-family="Consolas,monospace">' + d.value + '</text>';
    if (d.unit) {
      s += '<text x="16" y="66" font-size="9.5" fill="' + C.ink3 + '">' + d.unit + '</text>';
    }
    if (d.sub) {
      s += '<text x="' + (w - 14) + '" y="' + 48 + '" font-size="10" fill="#a9cbd6" text-anchor="end">' + d.sub + '</text>';
    }
    return wrap(s, w, h);
  }

  /* ---------- 生长曲线 ---------- */
  function growth(d) {
    var w = 340, h = 186, L = 36, R = 10, T = 12, B = 26;
    var g = d.g;
    var unit = d.unit === 'day' ? 'd' : 'a';
    var tMax = Math.max(d.t2 * 1.25, d.unit === 'day' ? 200 : 1.2);
    var yMax = g.inf * 1.06;

    function X(t) { return L + (t / tMax) * (w - L - R); }
    function Y(Lm) { return h - B - (Lm / yMax) * (h - T - B); }

    var s = '';
    /* 网格 */
    for (var i = 0; i <= 3; i++) {
      var yy = T + (h - T - B) * i / 3;
      s += '<line x1="' + L + '" y1="' + yy + '" x2="' + (w - R) + '" y2="' + yy + '" stroke="' + C.grid + '" stroke-width="1"/>';
      var lv = yMax * (1 - i / 3);
      s += '<text x="' + (L - 5) + '" y="' + (yy + 3) + '" font-size="8.5" fill="' + C.ink3 + '" text-anchor="end">' + n(lv, 0) + '</text>';
    }
    s += '<text x="' + (L - 5) + '" y="' + (T - 2) + '" font-size="8" fill="' + C.ink3 + '" text-anchor="end">mm</text>';

    /* 曲线 */
    var pts = [];
    for (var k = 0; k <= 80; k++) {
      var tt = tMax * k / 80;
      var LL = g.inf * (1 - Math.exp(-g.K * (tt - g.t0)));
      if (LL < 0) LL = 0;
      pts.push(X(tt).toFixed(1) + ',' + Y(LL).toFixed(1));
    }
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + C.sea5 + '" stroke-width="2"/>';

    /* 渐近线 */
    s += '<line x1="' + L + '" y1="' + Y(g.inf) + '" x2="' + (w - R) + '" y2="' + Y(g.inf) + '" stroke="' + C.sea3 + '" stroke-width="1" stroke-dasharray="4 4"/>';
    s += '<text x="' + (w - R) + '" y="' + (Y(g.inf) - 4) + '" font-size="8" fill="' + C.ink3 + '" text-anchor="end">L∞=' + n(g.inf, 1) + ' mm</text>';

    /* 两点 */
    function mark(t, Lm, color, label) {
      var x = X(t), y = Y(Lm);
      var low = y > (h - B - 40);
      var ty = low ? (y - 7) : (y - 7);
      var tx = x + 6;
      if (x > w * 0.72) tx = x - 6;
      var anchor = x > w * 0.72 ? 'end' : 'start';
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.4" fill="#fff" stroke="' + color + '" stroke-width="2"/>' +
        '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + (h - B) + '" stroke="' + color + '" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>' +
        '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" font-size="9" font-weight="700" fill="' + color + '" text-anchor="' + anchor + '">' + label + '</text>';
    }
    s += mark(d.t1, d.l1, C.sea, n(d.l1, 1) + ' mm');
    s += mark(d.t2, d.l2, C.warn, n(d.l2, 1) + ' mm');

    /* 轴 */
    s += '<line x1="' + L + '" y1="' + (h - B) + '" x2="' + (w - R) + '" y2="' + (h - B) + '" stroke="rgba(70,190,215,.4)" stroke-width="1"/>';
    s += '<text x="' + (w - R) + '" y="' + (h - 8) + '" font-size="8.5" fill="' + C.ink3 + '" text-anchor="end">' +
      (d.unit === 'day' ? '孵化后天数 (d)' : '年龄 (a)') + '</text>';
    s += '<text x="' + L + '" y="' + (h - 8) + '" font-size="8.5" fill="' + C.ink3 + '">0</text>';

    return wrap(s, w, h);
  }

  /* ---------- Schaefer 抛物线 ---------- */
  function schaefer(d) {
    var w = 340, h = 186, L = 34, R = 12, T = 12, B = 26;
    var fMax = Math.max(d.r * 1.45, 0.8);
    var yMax = d.MSY * 1.18;

    function X(f) { return L + (f / fMax) * (w - L - R); }
    function Y(y) { return h - B - (y / yMax) * (h - T - B); }

    var s = '';
    for (var i = 0; i <= 3; i++) {
      var yy = T + (h - T - B) * i / 3;
      s += '<line x1="' + L + '" y1="' + yy + '" x2="' + (w - R) + '" y2="' + yy + '" stroke="' + C.grid + '"/>';
      s += '<text x="' + (L - 5) + '" y="' + (yy + 3) + '" font-size="8.5" fill="' + C.ink3 + '" text-anchor="end">' + n(yMax * (1 - i / 3), 0) + '</text>';
    }

    /* 过度捕捞区 */
    s += '<rect x="' + X(d.Fmsy) + '" y="' + T + '" width="' + (w - R - X(d.Fmsy)) + '" height="' + (h - T - B) + '" fill="#d9534f" opacity=".06"/>';
    s += '<text x="' + (w - R - 4) + '" y="' + (T + 12) + '" font-size="8" fill="#b03a37" text-anchor="end">过度捕捞区</text>';

    var pts = [];
    for (var k = 0; k <= 90; k++) {
      var ff = fMax * k / 90;
      var y = ff <= d.r ? ff * d.K * (1 - ff / d.r) : 0;
      pts.push(X(ff).toFixed(1) + ',' + Y(y).toFixed(1));
    }
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + C.sea5 + '" stroke-width="2"/>';

    /* MSY 与 F_MSY */
    s += '<line x1="' + X(d.Fmsy) + '" y1="' + Y(d.MSY) + '" x2="' + X(d.Fmsy) + '" y2="' + (h - B) + '" stroke="' + C.sea3 + '" stroke-dasharray="4 4"/>';
    s += '<line x1="' + L + '" y1="' + Y(d.MSY) + '" x2="' + X(d.Fmsy) + '" y2="' + Y(d.MSY) + '" stroke="' + C.sea3 + '" stroke-dasharray="4 4"/>';
    s += '<text x="' + (X(d.Fmsy) + 4) + '" y="' + (h - B - 4) + '" font-size="8.5" fill="' + C.sea + '">F_MSY=' + n(d.Fmsy, 2) + '</text>';
    s += '<text x="' + (L + 3) + '" y="' + (Y(d.MSY) - 5) + '" font-size="8.5" fill="' + C.sea + '">MSY=' + n(d.MSY, 1) + '</text>';

    /* 当前点 */
    var cy = d.F <= d.r ? d.F * d.K * (1 - d.F / d.r) : 0;
    var color = d.ratio > 1.5 ? C.danger : d.ratio > 1.05 ? C.warn : C.ok;
    s += '<circle cx="' + X(d.F) + '" cy="' + Y(cy) + '" r="4.2" fill="' + color + '" stroke="#fff" stroke-width="1.5"/>';
    s += '<text x="' + (X(d.F) + 6) + '" y="' + (Y(cy) - 7) + '" font-size="9" font-weight="700" fill="' + color + '">F=' + n(d.F, 2) + '</text>';

    s += '<line x1="' + L + '" y1="' + (h - B) + '" x2="' + (w - R) + '" y2="' + (h - B) + '" stroke="rgba(70,190,215,.4)"/>';
    s += '<text x="' + (w - R) + '" y="' + (h - 8) + '" font-size="8.5" fill="' + C.ink3 + '" text-anchor="end">捕捞死亡 F (/a)</text>';
    s += '<text x="' + L + '" y="' + (h - 8) + '" font-size="8.5" fill="' + C.ink3 + '">0</text>';
    return wrap(s, w, h);
  }

  /* ---------- 因子得分条 ---------- */
  function score(d) {
    var w = 340, rowH = 27, T = 8, L = 82, R = 34;
    var h = T * 2 + d.parts.length * rowH + 14;
    var s = '';
    for (var i = 0; i < d.parts.length; i++) {
      var p = d.parts[i], y = T + i * rowH;
      var ratio = p.max ? p.score / p.max : 0;
      var color = ratio > 0.75 ? C.danger : ratio > 0.45 ? C.warn : C.ok;
      s += '<text x="' + (L - 7) + '" y="' + (y + 12) + '" font-size="9.5" fill="' + C.ink + '" text-anchor="end">' + p.name + '</text>';
      s += '<rect x="' + L + '" y="' + (y + 4) + '" width="' + (w - L - R) + '" height="9" rx="4.5" fill="rgba(255,255,255,.07)"/>';
      s += '<rect x="' + L + '" y="' + (y + 4) + '" width="' + Math.max(2, (w - L - R) * ratio).toFixed(1) + '" height="9" rx="4.5" fill="' + color + '"/>';
      s += '<text x="' + (w - R + 4) + '" y="' + (y + 12) + '" font-size="8.5" fill="' + C.ink3 + '">' + p.score + '/' + p.max + '</text>';
    }
    s += '<line x1="' + L + '" y1="' + (h - 10) + '" x2="' + (w - R) + '" y2="' + (h - 10) + '" stroke="rgba(70,190,215,.18)"/>';
    s += '<text x="' + L + '" y="' + (h - 1) + '" font-size="8.5" fill="' + C.ink3 + '">各因子得分（权重不同，满分见右）</text>';
    return wrap(s, w, h);
  }

  /* ---------- 投饵折减瀑布 ---------- */
  function feed(d) {
    var w = 340, h = 120, L = 26, R = 10, T = 14, B = 28;
    var steps = [
      { k: '基准', v: d.base },
      { k: '温度', v: d.base * d.fT },
      { k: '体重', v: d.base * d.fT * d.fW },
      { k: '水质', v: d.rate }
    ];
    var maxV = d.base * 1.12;
    var bw = (w - L - R) / steps.length * 0.58;
    var gap = (w - L - R) / steps.length;
    var s = '';
    for (var i = 0; i < steps.length; i++) {
      var v = steps[i].v;
      var bh = (v / maxV) * (h - T - B);
      var x = L + gap * i + gap / 2 - bw / 2;
      var y = h - B - bh;
      var color = i === 0 ? 'rgba(47,214,208,.28)' : i === 3 ? C.sea : C.sea5;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + color + '"/>';
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" font-size="9" font-weight="700" fill="' + C.sea + '" text-anchor="middle">' + n(v, 2) + '%</text>';
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 14) + '" font-size="9" fill="' + C.ink3 + '" text-anchor="middle">' + steps[i].k + '</text>';
    }
    s += '<line x1="' + L + '" y1="' + (h - B) + '" x2="' + (w - R) + '" y2="' + (h - B) + '" stroke="rgba(70,190,215,.25)"/>';
    return wrap(s, w, h);
  }

  function render(c) {
    if (!c) return '';
    if (c.type === 'callout') return callout(c);
    if (c.type === 'growth') return growth(c);
    if (c.type === 'schaefer') return schaefer(c);
    if (c.type === 'score') return score(c);
    if (c.type === 'feed') return feed(c);
    return '';
  }

  return { render: render, callout: callout, growth: growth, schaefer: schaefer };
})();

</script>
<script>
/* 08.ui.map.js — 海域态势示意图（纯 SVG，无地图服务） */
window.LC = window.LC || {};

LC.Map = (function () {

  var SHORT = {
    z_mactra: '四角蛤蜊', z_ruditapes: '菲律宾蛤仔', z_scapharca: '毛蚶',
    z_sinonovacula: '缢蛏', z_meretrix: '文蛤', z_cyclina: '青蛤',
    z_bullacta: '泥螺', z_ostrea: '牡蛎礁', z_reef: '鱼礁增殖',
    p_shrimp3: '3号塘', p_sole: '舌鳎车间'
  };

  var RISK_COLOR = { ok: '#0f3a49', warn: '#3f2f12', danger: '#3d1a1f' };
  var RISK_EDGE = { ok: 'rgba(47,214,208,.55)', warn: 'rgba(255,181,69,.62)', danger: 'rgba(255,95,109,.68)' };
  var RISK_DOT = { ok: '#2e9e6b', warn: '#dd9412', danger: '#d9534f' };

  var COAST = 'M0,352 C70,340 120,362 190,354 C260,346 330,330 420,338';

  function zoneG(z, sel) {
    var fill = RISK_COLOR[z.risk] || RISK_COLOR.ok;
    var edge = RISK_EDGE[z.risk] || RISK_EDGE.ok;
    var nm = SHORT[z.id] || z.name;
    var area = z.landBase
      ? (z.id === 'p_shrimp3' ? '12 亩' : '3 000 m²')
      : (z.areaWan * 10000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' 亩';
    var w = z.landBase ? 58 : 110;
    var h = z.landBase ? 34 : 62;
    var s = '<g class="zone' + (sel ? ' sel' : '') + '" data-zone="' + z.id + '" transform="translate(' + z.x + ',' + z.y + ')">';
    s += '<rect x="' + (-w / 2) + '" y="' + (-h / 2) + '" width="' + w + '" height="' + h + '" rx="7" fill="' + fill + '" stroke="' + edge + '" stroke-width="1.3" opacity=".97"/>';
    s += '<circle cx="' + (-w / 2 + 9) + '" cy="' + (-h / 2 + 10) + '" r="2.6" fill="' + RISK_DOT[z.risk] + '"/>';
    if (z.landBase) {
      s += '<text x="0" y="1" font-size="9.5" fill="#e2f8fc" text-anchor="middle" font-weight="700">' + nm + '</text>';
      s += '<text x="0" y="12" font-size="7.6" fill="#86b3c2" text-anchor="middle">' + area + '</text>';
    } else {
      s += '<text x="0" y="-4" font-size="11.5" fill="#e2f8fc" text-anchor="middle" font-weight="700">' + nm + '</text>';
      s += '<text x="0" y="14" font-size="9.5" fill="#86b3c2" text-anchor="middle">' + area + '</text>';
    }
    return s + '</g>';
  }

  function buoy(x, y, id, delay) {
    return '<g class="buoy">' +
      '<circle cx="' + x + '" cy="' + y + '" r="3.4" fill="none" stroke="#2fd6d0" stroke-width="1.4" class="pulse" style="animation-delay:' + delay + 's"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="3.6" fill="#071a26" stroke="#5ee7e0" stroke-width="1.6"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="1.1" fill="#5ee7e0"/>' +
      '<text x="' + (x + 7) + '" y="' + (y + 3) + '" font-size="7.6" fill="#5f97a8">' + id + '</text>' +
      '</g>';
  }

  function render(host, selId) {
    var s = '<svg viewBox="0 0 420 500" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei,PingFang SC,sans-serif">';

    s += '<defs>' +
      '<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#082434"/><stop offset="100%" stop-color="#051520"/>' +
      '</linearGradient>' +
      '<linearGradient id="landG" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#0e2b3a"/><stop offset="100%" stop-color="#071822"/>' +
      '</linearGradient>' +
      '<pattern id="gridP" width="35" height="35" patternUnits="userSpaceOnUse">' +
      '<path d="M35 0H0V35" fill="none" stroke="rgba(47,214,208,.13)" stroke-width=".8"/>' +
      '</pattern>' +
      '<radialGradient id="seaGlow" cx="50%" cy="42%" r="62%">' +
      '<stop offset="0%" stop-color="rgba(47,214,208,.16)"/><stop offset="100%" stop-color="rgba(47,214,208,0)"/>' +
      '</radialGradient>' +
      '</defs>';

    s += '<rect x="0" y="0" width="420" height="500" rx="8" fill="url(#seaG)"/>';
    s += '<rect x="0" y="0" width="420" height="352" fill="url(#gridP)"/>';
    s += '<rect x="0" y="0" width="420" height="352" fill="url(#seaGlow)"/>';

    /* HUD 角标 */
    s += '<g stroke="rgba(94,231,224,.55)" stroke-width="1.2" fill="none">' +
      '<path d="M12,34 V12 H34"/><path d="M408,34 V12 H386"/>' +
      '<path d="M12,318 V340 H34"/><path d="M408,318 V340 H386"/>' +
      '</g>';

    /* 海流示意 */
    s += '<path d="M20,60 C110,44 170,74 250,58 C320,44 380,54 408,44" fill="none" stroke="rgba(47,214,208,.28)" stroke-width="1.4" class="flow"/>';
    s += '<path d="M10,320 C110,306 170,330 260,314 C330,302 384,310 414,302" fill="none" stroke="rgba(47,214,208,.18)" stroke-width="1.2" class="flow" style="animation-delay:-1.4s"/>';
    s += '<path d="M24,140 C120,124 190,150 280,132 C340,120 390,128 414,120" fill="none" stroke="rgba(47,214,208,.12)" stroke-width="1" class="flow" style="animation-delay:-2.4s"/>';

    /* 陆地 */
    s += '<path d="' + COAST + ' L420,500 L0,500 Z" fill="url(#landG)"/>';
    s += '<path d="' + COAST + '" fill="none" stroke="#1d4b5a" stroke-width="14" stroke-linecap="round" opacity=".95"/>';
    s += '<path d="' + COAST + '" fill="none" stroke="#2f7080" stroke-width="1.1"/>';

    s += '<text x="46" y="27" font-size="9.5" fill="rgba(94,231,224,.55)" letter-spacing="3">莱 州 湾 海 域（示意）</text>';

    /* 浮标 */
    s += buoy(66, 328, '浮标 01', 0);
    s += buoy(210, 334, '浮标 02', 0.8);
    s += buoy(366, 320, '浮标 03', 1.6);

    /* 分区 */
    for (var i = 0; i < LC.ZONES.length; i++) {
      var z = LC.ZONES[i];
      if (!z.landBase) s += zoneG(z, z.id === selId);
    }

    /* 潮间带标注 */
    s += '<text x="12" y="398" font-size="8.6" fill="rgba(214,180,90,.65)">潮间带 / 滩涂底播区（示意）</text>';

    /* 陆基园区 */
    s += '<rect x="222" y="364" width="186" height="120" rx="9" fill="rgba(9,28,40,.85)" stroke="rgba(70,190,215,.45)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".95"/>';
    s += '<text x="232" y="380" font-size="8.6" fill="#7fd8d2" font-weight="700">陆基园区 · 工厂化 / 池塘</text>';
    for (var j = 0; j < LC.ZONES.length; j++) {
      if (LC.ZONES[j].landBase) s += zoneG(LC.ZONES[j], LC.ZONES[j].id === selId);
    }

    /* 图例 */
    s += '<g transform="translate(12,412)">' +
      '<rect x="0" y="0" width="196" height="74" rx="7" fill="rgba(7,22,33,.92)" opacity=".97" stroke="rgba(70,190,215,.3)"/>' +
      '<circle cx="12" cy="15" r="3.2" fill="#2e9e6b"/><text x="20" y="18" font-size="8.6" fill="#a7c8d4">正常</text>' +
      '<circle cx="62" cy="15" r="3.2" fill="#dd9412"/><text x="70" y="18" font-size="8.6" fill="#a7c8d4">预警</text>' +
      '<circle cx="112" cy="15" r="3.2" fill="#d9534f"/><text x="120" y="18" font-size="8.6" fill="#a7c8d4">超限</text>' +
      '<text x="12" y="37" font-size="7.6" fill="#6d95a6">龙威国家级海洋牧场 · 5.3 万亩 · 九大分区</text>' +
      '<text x="12" y="50" font-size="7.6" fill="#6d95a6">分区结构依据公开报道整理</text>' +
      '<text x="12" y="64" font-size="7.6" fill="rgba(214,180,90,.62)">非真实地理边界，不作权属与导航依据</text>' +
      '</g>';

    /* 指北 */
    s += '<g transform="translate(396,34)">' +
      '<path d="M0,-12 L4.6,4 L0,0 L-4.6,4 Z" fill="rgba(94,231,224,.8)"/>' +
      '<text x="0" y="15" font-size="8" fill="rgba(94,231,224,.8)" text-anchor="middle">N</text>' +
      '</g>';

    s += '</svg>';
    host.innerHTML = s;

    var gs = host.querySelectorAll('.zone');
    for (var k = 0; k < gs.length; k++) {
      gs[k].addEventListener('click', function () {
        LC.Store.setZone(this.getAttribute('data-zone'));
      });
    }
  }

  return { render: render };
})();

</script>
<script>
/* 09.ui.chat.js — 对话工作台 */
window.LC = window.LC || {};

LC.Chat = (function () {

  var log, chipsEl, inputEl, formEl;
  var busy = false;

  var PRESETS = [
    '3号塘溶氧4.2，pH8.9，氨氮0.45，虾有没有事？',
    '那这个塘今天还投饵吗？',
    '蛤仔壳长3厘米，养到4.5厘米要多久？能捕吗？',
    '梭子蟹捕捞死亡率0.7，要调到多少？',
    '贝类到底算不算碳汇？'
  ];

  function scroll() {
    log.scrollTop = log.scrollHeight;
  }

  function append(html, align) {
    log.insertAdjacentHTML('beforeend', html);
    var last = log.lastElementChild;
    if (align === 'start' && last && last.scrollIntoView) {
      try { last.scrollIntoView({ block: 'start' }); } catch (e) { scroll(); }
    } else {
      scroll();
    }
  }

  function currentZoneSpecies() {
    var z = LC.Store.zone();
    return (z && z.speciesId) || LC.Store.S.ctx.speciesId;
  }

  function buildArgs(intent, slots) {
    var st = LC.Store.S;
    var z = LC.Store.zone();
    var spId = slots.speciesId || z.speciesId || st.ctx.speciesId;
    var a = { speciesId: spId, zoneId: z.id };

    if (intent === 'water.check') {
      a.do = slots.nums.do; a.ph = slots.nums.ph;
      a.tan = slots.nums.tan; a.no2 = slots.nums.no2;
      a.temp = slots.nums.temp != null ? slots.nums.temp : (z.temp != null ? z.temp : z.kpi.temp);
      if (a.do == null && a.ph == null && a.tan == null) {
        if (z.id === 'p_shrimp3') {
          var r = LC.DEMO_LOG.reading;
          a.do = r.do; a.ph = r.ph; a.tan = r.tan; a.no2 = r.no2; a.temp = r.temp;
          a.isDemo = true;
        } else {
          a.do = z.kpi.do; a.ph = 8.1; a.tan = 0.18; a.isDemo = true;
        }
      }
    }

    if (intent === 'feed.calc') {
      a.biomassKg = z.biomassKg != null ? z.biomassKg : 800;
      a.avgWeightG = z.avgWeightG != null ? z.avgWeightG : null;
      a.temp = slots.nums.temp != null ? slots.nums.temp : (z.temp != null ? z.temp : z.kpi.temp);
      var lw = st.ctx.lastWater;
      a.waterLevel = (lw && lw.zoneId === z.id) ? lw.level : 'ok';
    }

    if (intent === 'growth.predict') {
      var L = slots.lengths;
      if (L.length >= 2) { a.fromMm = L[0].mm; a.toMm = L[1].mm; }
      else if (L.length === 1) { a.fromMm = L[0].mm; a.toMm = Math.round(L[0].mm * 1.5); }
      a.sex = slots.sex || null;
    }

    if (intent === 'stock.assess') a.F = slots.F;
    if (intent === 'redtide.risk') { a.chl = z.kpi.chl; a.temp = z.kpi.temp; }
    if (intent === 'carbon.calc') a.areaWan = z.areaWan;
    if (intent === 'release.plan') a.speciesId = slots.speciesId || 'penaeus_chinensis';

    return a;
  }

  function run(parsed) {
    var T = LC.Tools, res = null;
    var args = buildArgs(parsed.intent, parsed.slots);

    switch (parsed.intent) {
      case 'water.check': res = T.assessWater(args); break;
      case 'feed.calc': res = T.calcFeed(args); break;
      case 'growth.predict': res = T.predictGrowth(args); break;
      case 'stock.assess': res = T.assessStock(args); break;
      case 'redtide.risk': res = T.scoreRedTide(args); break;
      case 'carbon.calc': res = T.calcBlueCarbon(args); break;
      case 'release.plan': res = T.planRelease(args); break;
      case 'policy.query': res = T.queryPolicy(args); break;
      default: res = null;
    }

    if (parsed.intent === 'water.check') {
      LC.Store.S.ctx.lastWater = { level: res.level, zoneId: args.zoneId, at: Date.now() };
    }
    return res;
  }

  function thinkingCard(steps) {
    return '<div class="msg msg-agent" id="thinking"><div class="msg-head">' +
      '<span class="avatar">智能</span><span class="who">蓝仓智脑</span></div>' +
      '<div class="card"><div class="thinking">' +
      '<span class="dots"><i></i><i></i><i></i></span>' +
      '<span id="thinkTxt">' + (steps[0] || '正在解析意图…') + '</span></div>' +
      '<div class="step-line" id="thinkStep">' + (steps[1] || '') + '</div></div></div>';
  }

  function ask(text, silentUser) {
    if (busy) return;
    var raw = String(text || '').trim();
    if (!raw) return;

    busy = true;
    if (!silentUser) append(LC.Tpl.userMsg(raw));
    inputEl.value = '';

    var parsed = LC.NLU.parse(raw, LC.Store.S.ctx);

    if (parsed.intent === 'easter') {
      append(LC.Tpl.easter());
      busy = false;
      return;
    }
    if (parsed.intent === 'greet' || parsed.intent === 'help' || !parsed.intent) {
      append(LC.Tpl.help());
      busy = false;
      return;
    }

    if (parsed.slots.zoneId) {
      LC.Store.setZone(parsed.slots.zoneId, true);
      LC.Map.render(document.getElementById('mapWrap'), parsed.slots.zoneId);
      LC.Layout && LC.Layout.kpi();
      LC.Store.emit('zone', parsed.slots.zoneId);
    }

    var steps = [
      '正在识别意图 · ' + parsed.intentName,
      '抽取槽位 → 调用 ' + (function () {
        for (var i = 0; i < LC.NLU.INTENTS.length; i++) if (LC.NLU.INTENTS[i].id === parsed.intent) return LC.NLU.INTENTS[i].tool + '()';
        return '通用应答';
      })()
    ];

    append(thinkingCard(steps), 'start');
    var box = document.getElementById('thinking');
    var txt = document.getElementById('thinkTxt');
    var step = document.getElementById('thinkStep');

    setTimeout(function () {
      if (txt) txt.textContent = '正在调用领域模型并校验参数…';
      if (step) step.textContent = '参数单位断言 · 阈值比对 · 生成推理链';
    }, 260);

    setTimeout(function () {
      var res = null;
      try {
        res = run(parsed);
      } catch (e) {
        res = null;
      }
      if (box && box.parentNode) box.parentNode.removeChild(box);

      if (!res) {
        append(LC.Tpl.help(), 'start');
      } else {
        append(LC.Tpl.render(res, LC.Store.focusText().replace('当前关注：', '')), 'start');
      }
      busy = false;
      LC.Layout && LC.Layout.kpi();
      LC.Store.emit('answered', parsed);
    }, 760);
  }

  function renderChips() {
    var h = '';
    for (var i = 0; i < PRESETS.length; i++) {
      h += '<button type="button" class="chip" data-ask="' + LC.Tpl.esc(PRESETS[i]) + '">' +
        '<kbd>' + (i + 1) + '</kbd>' + LC.Tpl.esc(PRESETS[i]) + '</button>';
    }
    chipsEl.innerHTML = h;
  }

  function bind() {
    log = document.getElementById('chatLog');
    chipsEl = document.getElementById('chips');
    inputEl = document.getElementById('askInput');
    formEl = document.getElementById('askForm');

    renderChips();

    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      ask(inputEl.value);
    });

    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-ask]') : null;
      if (t) ask(t.getAttribute('data-ask'));
    });

    document.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key >= '1' && e.key <= '5') {
        var idx = parseInt(e.key, 10) - 1;
        if (PRESETS[idx]) { e.preventDefault(); ask(PRESETS[idx]); }
      }
      if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        LC.Store.reset();
        log.innerHTML = '';
        welcome();
        LC.Map.render(document.getElementById('mapWrap'), LC.Store.S.ctx.zoneId);
        LC.Layout.refreshAll();
      }
    });
  }

  function welcome() {
    var M = LC.META;
    var h = '<div class="msg msg-agent"><div class="msg-head">' +
      '<span class="avatar">智能</span><span class="who">蓝仓智脑</span>' +
      '<span class="focus-pill">' + M.build + '</span></div>' +
      '<div class="card lvl-ok">' +
      '<div class="card-title">蓝仓智脑 · 莱州湾智慧海洋牧场知识智能体</div>' +
      '<div class="summary">' + M.slogan + '。没有联网大模型：<b>意图识别 → 槽位抽取 → 模型调用 → 结构化生成</b>，全部在浏览器里跑完，断网不影响。' +
      '</div>' +
      '<div class="caveat"><b>立论：</b>' + M.hook + '</div>' +
      '</div></div>';
    append(h);
  }

  return { bind: bind, ask: ask, welcome: welcome, PRESETS: PRESETS };
})();

</script>
<script>
/* 10.ui.lab.js — 决策模型实验室 */
window.LC = window.LC || {};

LC.Lab = (function () {

  var host;
  var st = { tab: 'growth', spId: 'philippinarum', sex: 'all', F: 0.35 };

  var GROW_SP = ['philippinarum', 'sole', 'portunus', 'penaeus_chinensis'];

  function sp() { return LC.SPECIES[st.spId]; }

  function sexesOf(g) { return g.sexes; }

  function currentG() {
    var g = sp().growth;
    if (!g) return null;
    var keys = Object.keys(g.sexes);
    var key = g.sexes[st.sex] ? st.sex : keys[0];
    return { g: g.sexes[key], meta: g, key: key };
  }

  function growthPanel() {
    var s = sp();
    var cur = currentG();
    var g = cur.g, meta = cur.meta;
    var unitCn = meta.unit === 'day' ? '天' : '年';
    var ages = meta.unit === 'day' ? [60, 120, 180] : [1, 2, 3];

    var samples = ages.map(function (t) {
      var L = g.inf * (1 - Math.exp(-g.K * (t - g.t0)));
      return { t: t, L: Math.max(0, L) };
    });

    var t1 = ages[0], t2 = ages[ages.length - 1];
    var l1 = Math.max(0, g.inf * (1 - Math.exp(-g.K * (t1 - g.t0))));
    var l2 = Math.max(0, g.inf * (1 - Math.exp(-g.K * (t2 - g.t0))));

    var h = '';
    h += '<div class="lab-sec"><select class="lab-sel" id="labSp">';
    for (var i = 0; i < GROW_SP.length; i++) {
      var x = LC.SPECIES[GROW_SP[i]];
      h += '<option value="' + x.id + '"' + (x.id === st.spId ? ' selected' : '') + '>' + x.name + '</option>';
    }
    h += '</select></div>';

    var keys = Object.keys(meta.sexes);
    if (keys.length > 1) {
      h += '<div class="lab-sec" style="display:flex;gap:5px">';
      for (var k = 0; k < keys.length; k++) {
        var kk = keys[k];
        h += '<button type="button" class="lab-tab' + (kk === cur.key ? ' on' : '') + '" data-sex="' + kk + '" style="flex:1 1 0;padding:4px 2px;font-size:calc(10px * var(--scale))">' +
          meta.sexes[kk].label + '</button>';
      }
      h += '</div>';
    }

    h += '<div class="lab-sec">' + LC.Chart.growth({
      g: g, unit: meta.unit, l1: l1, l2: l2, t1: t1, t2: t2
    }) + '</div>';

    h += '<div class="readout">';
    for (var j = 0; j < samples.length; j++) {
      h += '<div><span>' + samples[j].t + ' ' + (meta.unit === 'day' ? '天' : '龄') + '</span><strong>' + samples[j].L.toFixed(1) + '<small style="font-size:9px"> mm</small></strong></div>';
    }
    h += '</div>';

    h += '<div class="verdict">L∞ = <b>' + g.inf.toFixed(1) + ' mm</b>，K = <b>' + g.K + ' /' + (meta.unit === 'day' ? 'd' : 'a') +
      '</b>，t0 = <b>' + g.t0 + ' ' + unitCn + '</b>。' +
      (meta.unit === 'day' ? '<br>⚠ 本种 t 以<b>天</b>计，t0 为正——按"年"代入会算错两个数量级。' : '') +
      '</div>';

    h += '<div class="verdict" style="margin-top:6px">' + (meta.note || '') + '</div>';
    return h;
  }

  function stockPanel() {
    var r = 0.70, K = 100;
    var F = st.F;
    var Fmsy = r / 2, MSY = r * K / 4;
    var Y = F <= r ? F * K * (1 - F / r) : 0;

    var h = '';
    h += '<div class="lab-sec">' + LC.Chart.schaefer({
      r: r, K: K, F: F, Fmsy: Fmsy, MSY: MSY, ratio: F / Fmsy
    }) + '</div>';

    h += '<div class="lab-sec"><div class="lab-label"><b>捕捞死亡 F</b><span>' + F.toFixed(2) + ' /a</span></div>' +
      '<input type="range" class="lab-range" id="labF" min="0" max="1.2" step="0.01" value="' + F + '"></div>';

    h += '<div class="readout">' +
      '<div><span>F_MSY = r/2</span><strong>' + Fmsy.toFixed(2) + '</strong></div>' +
      '<div><span>MSY = rK/4</span><strong>' + MSY.toFixed(1) + '</strong></div>' +
      '<div><span>当前产量 Y</span><strong>' + Y.toFixed(1) + '</strong></div>' +
      '</div>';

    var cls = F / Fmsy > 1.5 ? 'danger' : F / Fmsy > 1.05 ? 'warn' : '';
    var rr = F / Fmsy, txt;
    if (F >= r) txt = '产量归零。这不是"捕得少"，是资源崩溃的临界点——再往上，种群无法自我补充。';
    else if (rr > 1.05) txt = '当前 F 为 F_MSY 的 <b>' + rr.toFixed(2) + ' 倍</b>，已越过最适点：多投入一份努力，总产量反而下降。';
    else if (rr > 0.95) txt = '当前 F 正好落在 <b>F_MSY</b> 上：这是抛物线的顶点，产量达到最大值 MSY = ' + MSY.toFixed(1) + '，且长期可持续。';
    else txt = '当前 F 低于 F_MSY，产量尚未到最大；可适度增加努力量，但需同步监测资源结构。';

    h += '<div class="verdict ' + cls + '">' + txt + '</div>';
    h += '<div class="verdict" style="margin-top:6px">r 取 0.70 /a（约等于自然死亡系数 M），K 为相对单位（100）。' +
      'r ≈ M 只是经验近似，正式评估需年龄结构数据与 Y/R 分析。</div>';
    return h;
  }

  function render() {
    if (!host) host = document.getElementById('lab');
    var h = '';
    h += '<div class="lab-tabs">' +
      '<button type="button" class="lab-tab' + (st.tab === 'growth' ? ' on' : '') + '" data-tab="growth">生长模型</button>' +
      '<button type="button" class="lab-tab' + (st.tab === 'stock' ? ' on' : '') + '" data-tab="stock">剩余产量</button>' +
      '</div>';
    h += st.tab === 'growth' ? growthPanel() : stockPanel();
    host.innerHTML = h;
    bind();
  }

  function bind() {
    var sel = document.getElementById('labSp');
    if (sel) sel.addEventListener('change', function () {
      st.spId = this.value;
      var k = Object.keys(LC.SPECIES[st.spId].growth.sexes);
      st.sex = LC.SPECIES[st.spId].growth.sexes.all ? 'all' : k[0];
      render();
    });

    var sexBtns = host.querySelectorAll('[data-sex]');
    for (var i = 0; i < sexBtns.length; i++) {
      sexBtns[i].addEventListener('click', function () {
        st.sex = this.getAttribute('data-sex');
        render();
      });
    }

    var tabs = host.querySelectorAll('[data-tab]');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].addEventListener('click', function () {
        st.tab = this.getAttribute('data-tab');
        render();
      });
    }

    var rng = document.getElementById('labF');
    if (rng) rng.addEventListener('input', function () {
      st.F = parseFloat(this.value);
      render();
    });
  }

  return { render: render, state: st };
})();

</script>
<script>
/* 11.main.js — 布局、顶栏交互与启动 */
window.LC = window.LC || {};

LC.Layout = (function () {

  var kpiEl, focusEl;

  var RISK_TXT = { ok: '正常', warn: '预警', danger: '超限' };
  var RISK_CLS = { ok: 'stat-ok', warn: 'stat-warn', danger: 'stat-danger' };

  function card(k, v, unit, cls, wide) {
    return '<div class="kpi-card' + (wide ? ' wide' : '') + '">' +
      '<div class="k">' + k + '</div>' +
      '<div class="v ' + (cls || '') + '">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div></div>';
  }

  function kpi() {
    var z = LC.Store.zone();
    var sp = LC.SPECIES[z.speciesId];
    var area = z.landBase
      ? (z.id === 'p_shrimp3' ? '12' : '0.3')
      : (z.areaWan * 10000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var areaUnit = z.landBase ? (z.id === 'p_shrimp3' ? '亩' : '公顷') : '亩';

    var h = '';
    h += card('当前分区', z.name, '', '', true);
    h += card('面积', area, areaUnit);
    h += card('主养品种', sp ? sp.name : '—');
    h += card('水温', z.kpi.temp.toFixed(1), '℃');
    h += card('溶解氧', z.kpi.do.toFixed(2), 'mg/L',
      z.kpi.do < 4 ? 'stat-danger' : z.kpi.do < 5 ? 'stat-warn' : 'stat-ok');
    if (z.kpi.chl) h += card('叶绿素 a', z.kpi.chl.toFixed(1), 'μg/L', z.kpi.chl > 5 ? 'stat-warn' : '');
    h += card('盐度', z.kpi.sal.toFixed(1), '‰');
    h += card('状态', RISK_TXT[z.risk], '', RISK_CLS[z.risk]);
    if (z.biomassKg) h += card('存塘（示例）', z.biomassKg, 'kg', '', true);
    else if (z.biomassT) h += card('存塘（示例）', z.biomassT, 't', '', true);

    h += '<div class="kpi-card wide" style="border-style:dashed">' +
      '<div class="k" style="line-height:1.55;white-space:normal">' +
      '<b style="color:#8ff0e8">' + z.kpi.sub + '</b>　·　' +
      '监测数值为演示样例，非实时物联数据</div></div>';

    kpiEl.innerHTML = h;
  }

  function focus() {
    focusEl.textContent = LC.Store.focusText();
  }

  function refreshAll() {
    kpi();
    focus();
    LC.Map.render(document.getElementById('mapWrap'), LC.Store.S.ctx.zoneId);
    LC.Lab.render();
  }

  function modal(html) {
    var m = document.getElementById('modal');
    document.getElementById('modalBox').innerHTML = html;
    m.hidden = false;
  }

  function closeModal() { document.getElementById('modal').hidden = true; }

  function about() {
    var M = LC.META;
    modal(
      '<h3>' + M.title + '　<span style="font-size:12px;color:#6d95a6;font-weight:400">' + M.sub + '</span></h3>' +
      '<div class="m-sub">' + M.build + '　·　参赛类别：智能体 AIGC 应用</div>' +
      '<div class="m-tags"><span>OFFLINE</span><span>零第三方库</span><span>单文件</span><span>本地推理</span><span>参数可溯源</span></div>' +
      '<p><b>三句话自评</b></p>' +
      '<div class="m-quote">这是一个不联网也能工作的渔业专家系统。<br>' +
      '它所有的参数都能追溯到标准、文献或明确的"示例值"。<br>' +
      '它面对争议时，选择把争议展示出来，而不是替观众下结论。</div>' +
      '<p><b>场景</b>：' + M.siteNote + '</p>' +
      '<p><b>专业内核</b>：水质阈值与分子氨耦合、投饵率模型、von Bertalanffy 生长方程、Schaefer 剩余产量模型、'
      + '赤潮多因子评分、蓝碳三尺度核算、增殖放流方案、渔政合规查询。</p>' +
      '<p><b>边界声明</b>：监测值为演示样例；分区结构依据公开报道整理；示意图非真实地理边界，不表示任何权属；'
      + '所有阈值需按本场实测校准；本系统不构成生产、法律或投资建议。</p>' +
      '<p><b>快捷键</b>：1—5 触发预设问答　R 重置演示　点击海图分区切换关注对象</p>' +
      '<p style="color:#6d95a6;font-size:11px">' + M.hook + '（' + M.hookSrc + '）</p>' +
      '<button type="button" class="m-close" id="mClose">知道了</button>'
    );
    document.getElementById('mClose').addEventListener('click', closeModal);
  }

  function bind() {
    kpiEl = document.getElementById('kpi');
    focusEl = document.getElementById('focusBar');

    document.getElementById('btnAbout').addEventListener('click', about);
    document.getElementById('modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    document.getElementById('btnReset').addEventListener('click', function () {
      LC.Store.reset();
      document.getElementById('chatLog').innerHTML = '';
      LC.Chat.welcome();
      refreshAll();
    });

    var bp = document.getElementById('btnPerf');
    bp.addEventListener('click', function () {
      var on = !document.body.classList.contains('perf');
      document.body.classList.toggle('perf', on);
      bp.classList.toggle('on', on);
      LC.Store.S.prefs.perf = on;
      LC.Store.safeSet('prefs', LC.Store.S.prefs);
    });

    var bj = document.getElementById('btnProj');
    bj.addEventListener('click', function () {
      var on = !document.body.classList.contains('proj');
      document.body.classList.toggle('proj', on);
      bj.classList.toggle('on', on);
      LC.Store.S.prefs.proj = on;
      LC.Store.safeSet('prefs', LC.Store.S.prefs);
    });

    var bm = document.getElementById('btnMap');
    if (bm) bm.addEventListener('click', function () {
      var on = !document.body.classList.contains('map-open');
      document.body.classList.toggle('map-open', on);
      this.classList.toggle('on', on);
    });

    LC.Store.on(function (evt) {
      if (evt === 'zone') {
        kpi(); focus();
        if (window.innerWidth <= 760) {
          document.body.classList.remove('map-open');
          var b = document.getElementById('btnMap');
          if (b) b.classList.remove('on');
        }
      }
      if (evt === 'reset') { focus(); }
    });
  }

  function boot() {
    bind();

    var prefs = LC.Store.safeGet('prefs', null);
    if (prefs) {
      if (prefs.perf) { document.body.classList.add('perf'); document.getElementById('btnPerf').classList.add('on'); }
      if (prefs.proj) { document.body.classList.add('proj'); document.getElementById('btnProj').classList.add('on'); }
    }

    var q = location.search;
    var lt = q.match(/[?&]lab=(\w+)/);
    if (lt) LC.Lab.state.tab = lt[1];

    LC.Map.render(document.getElementById('mapWrap'), LC.Store.S.ctx.zoneId);
    LC.Chat.bind();
    LC.Chat.welcome();
    LC.Lab.render();
    kpi();
    focus();

    var aq = q.match(/[?&]ask=([^&]+)/);
    if (aq) {
      var txt = decodeURIComponent(aq[1]);
      setTimeout(function () { LC.Chat.ask(txt, false); }, 700);
      return;
    }

    var dm = q.match(/[?&]demo=(\d)?/);
    if (dm) {
      document.body.classList.add('proj');
      document.getElementById('btnProj').classList.add('on');
      var idx = dm[1] ? Math.max(1, Math.min(5, parseInt(dm[1], 10))) - 1 : 0;
      setTimeout(function () { LC.Chat.ask(LC.Chat.PRESETS[idx], false); }, 900);
    }
  }

  return { boot: boot, kpi: kpi, focus: focus, refreshAll: refreshAll, about: about };
})();

document.addEventListener('DOMContentLoaded', function () {
  LC.Layout.boot();
});

</script>
